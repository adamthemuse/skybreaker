<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1d12">
<title>Number Dojo</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="../icon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f0e1;--paper2:#efe4cc;--wood:#b9844f;--wood2:#8f5f33;--ink:#1f2a44;--ink2:#4a5674;--red:#d64545;--red2:#a92f2f;
  --gold:#f2b90f;--gold2:#c48f00;--green:#2fa85a;--blue:#3a7bdc;--card:#fffaf0;--line:rgba(31,42,68,.14);
  --font:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1d12}
body{font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- dojo background ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
   linear-gradient(180deg,transparent 0 66%,rgba(0,0,0,.08) 66%,transparent 67%),
   repeating-linear-gradient(90deg,transparent 0 118px,#8f5f33 118px 126px),
   linear-gradient(180deg,#f3e8d1 0 66%,transparent 66%);
}
#bg::before{content:"";position:absolute;left:0;right:0;top:0;height:66%;
  background:repeating-linear-gradient(0deg,transparent 0 58px,rgba(143,95,51,.22) 58px 60px),repeating-linear-gradient(90deg,transparent 0 58px,rgba(143,95,51,.22) 58px 60px)}
#bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;
  background:repeating-linear-gradient(90deg,#c08b55 0 160px,#b27d48 160px 162px,#c99560 162px 320px,#b27d48 320px 322px);box-shadow:inset 0 14px 30px rgba(0,0,0,.18)}
#bg .win{position:absolute;left:50%;top:7%;transform:translateX(-50%);width:min(520px,70vw);aspect-ratio:2.2;border:12px solid #8f5f33;border-radius:6px;overflow:hidden;
  background:linear-gradient(180deg,#9fd3ff,#e9f6ff 70%);box-shadow:0 10px 30px rgba(0,0,0,.18)}
#bg .win svg{position:absolute;inset:0;width:100%;height:100%}
#bg .banner{position:absolute;top:0;width:70px;height:46%;background:linear-gradient(180deg,#c33 0,#a22 100%);box-shadow:0 8px 20px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:#ffe9a8;font-size:34px;font-weight:900;writing-mode:vertical-rl;letter-spacing:6px}
#bg .banner.l{left:4%}#bg .banner.r{right:4%}
#bg .banner::after{content:"";position:absolute;bottom:-18px;left:0;border-left:35px solid transparent;border-right:35px solid transparent;border-top:18px solid #a22}

/* ---------- screens ---------- */
#app{position:fixed;inset:0;z-index:1}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.screen>.wrap{margin:auto;width:100%;max-width:1100px}
.panel{min-width:0;background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 rgba(31,42,68,.85),0 18px 40px rgba(0,0,0,.25);padding:20px}
h1,h2,h3{margin:0;line-height:1.1}
.title{font-weight:900;font-size:clamp(34px,6vw,64px);letter-spacing:-.5px;color:var(--ink);text-shadow:0 4px 0 rgba(255,255,255,.6)}
.title span{color:var(--red)}
.sub{font-weight:700;color:var(--ink2);font-size:clamp(15px,2vw,19px);margin-top:6px}

.btn{border:3px solid var(--ink);background:#fff;border-radius:18px;padding:12px 20px;min-height:54px;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--gold);}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.big{font-size:24px;min-height:70px;padding:14px 32px;border-radius:22px}
.btn.small{min-height:42px;font-size:15px;padding:8px 14px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.iconbtn{width:52px;height:52px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-size:24px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.center{text-align:center;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-weight:900;font-size:15px}

/* ---------- avatar ---------- */
.av{width:100%;height:100%;overflow:visible}
.av .armL{transform-box:view-box;transform-origin:66px 126px}
.av .armR{transform-box:view-box;transform-origin:134px 126px}
.av .legL{transform-box:view-box;transform-origin:86px 178px}
.av .legR{transform-box:view-box;transform-origin:114px 178px}
.av .upper{transform-box:view-box;transform-origin:100px 182px}
.av .body{transform-box:view-box;transform-origin:100px 260px}
.av .head{transform-box:view-box;transform-origin:100px 120px}
.idle .av .body{animation:breathe 2.6s ease-in-out infinite}
.idle .av .head{animation:nod 5s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-3px) scaleY(1.01)}}
@keyframes nod{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-4deg)}}
.pose-chop .av .armR{animation:chop .5s cubic-bezier(.3,.1,.3,1)}
@keyframes chop{0%{transform:rotate(0)}40%{transform:rotate(-160deg)}70%{transform:rotate(-20deg)}100%{transform:rotate(0)}}
.pose-chop .av .upper{animation:lean .5s ease}
@keyframes lean{40%{transform:rotate(-4deg)}70%{transform:rotate(6deg)}}
.pose-kick .av .legR{animation:kick .55s ease}
@keyframes kick{0%{transform:rotate(0)}45%,60%{transform:rotate(-95deg)}100%{transform:rotate(0)}}
.pose-kick .av .upper{animation:leanb .55s ease}
@keyframes leanb{45%,60%{transform:rotate(-10deg)}}
.pose-punch .av .armR{animation:punch .4s ease}
@keyframes punch{0%{transform:rotate(0)}40%,60%{transform:rotate(-88deg) translateY(-6px)}100%{transform:rotate(0)}}
.pose-bow .av .upper{animation:bow 1.2s ease}
@keyframes bow{30%,70%{transform:rotate(28deg)}}
.pose-cheer .av .armL{animation:cheerL .9s ease 2}
.pose-cheer .av .armR{animation:cheerR .9s ease 2}
.pose-cheer .av .body{animation:hop .45s ease 4}
@keyframes cheerL{30%,70%{transform:rotate(150deg)}}
@keyframes cheerR{30%,70%{transform:rotate(-150deg)}}
@keyframes hop{50%{transform:translateY(-16px)}}
.pose-oops .av .head{animation:shake .5s ease}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.flip .av{transform:scaleX(-1)}

/* ---------- master bubble ---------- */
.master{display:flex;gap:12px;align-items:flex-end}
.master .who{width:110px;height:154px;flex:none}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px 16px;font-weight:800;font-size:clamp(16px,2vw,19px);line-height:1.35;box-shadow:0 5px 0 rgba(31,42,68,.85)}
.bubble::before{content:"";position:absolute;left:-16px;bottom:22px;border-right:16px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent}
.bubble::after{content:"";position:absolute;left:-11px;bottom:24px;border-right:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
.bubble b{color:var(--red)}

/* ---------- profiles ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-top:20px}
.pcard{border:3px solid var(--ink);border-radius:24px;background:#fff;box-shadow:0 6px 0 var(--ink);padding:10px 10px 14px;cursor:pointer;text-align:center;position:relative}
.pcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.pcard .pa{height:170px}
.pcard b{display:block;font-size:20px}
.pcard small{font-weight:800;color:var(--ink2)}
.pcard .beltbar{height:10px;border-radius:5px;margin:6px 20px 0;border:2px solid rgba(0,0,0,.3)}
.pcard.new{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px;border-style:dashed;font-weight:900;font-size:20px}
.pcard.new span{font-size:54px;line-height:1}

/* ---------- creator ---------- */
.creator{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:20px;align-items:start}
.creator .preview{height:380px;background:radial-gradient(circle at 50% 70%,#fff8e6,#f1e2c2);border:3px solid var(--ink);border-radius:26px}
.opt h3{font-size:17px;margin:14px 0 8px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:48px;height:48px;border-radius:14px;border:3px solid var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;background:#fff}
.sw.on{outline:4px solid var(--red);outline-offset:2px}
.sw.hairopt{width:64px;height:64px;padding:2px}
.sw.hairopt{overflow:hidden}.sw.hairopt svg{width:100%;height:100%;overflow:hidden}
.sw.locked{opacity:.4}
.nameinput{font-family:inherit;font-size:24px;font-weight:900;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;width:100%;max-width:360px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}

/* ---------- hub ---------- */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:4px 14px 4px 4px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.me .mini{width:52px;height:60px;overflow:hidden}
.me .mini svg{width:52px;height:73px;margin-top:-4px}
.me b{font-size:18px;display:block}.me small{font-weight:800;color:var(--ink2);font-size:13px}
.spacer{flex:1}
.flame{font-size:20px}
.hubgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:14px}
.nextcard{display:flex;gap:14px;align-items:center}
.nextcard .mcard-ico{font-size:52px}
.belts{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:thin;touch-action:pan-x pan-y}
.beltpill{flex:none;min-width:118px;border:3px solid var(--ink);border-radius:18px;padding:8px 10px;background:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:center;font-weight:900;font-size:14px;position:relative}
.beltpill .bk{height:14px;border-radius:7px;border:2px solid rgba(0,0,0,.35);margin:2px 0 6px}
.beltpill.sel{outline:4px solid var(--red);outline-offset:2px}
.beltpill.locked{opacity:.45}
.beltpill .done{position:absolute;top:-10px;right:-8px;background:var(--green);color:#fff;border:2.5px solid var(--ink);border-radius:999px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:12px}
.mcard{border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--ink);padding:12px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center;min-height:88px}
.mcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.mcard .ico{font-size:34px;width:44px;text-align:center;flex:none}
.mcard b{display:block;font-size:17px}
.mcard small{font-weight:800;color:var(--ink2)}
.mcard.locked{opacity:.45;cursor:default}
.mcard.mastered{background:linear-gradient(135deg,#fff7d6,#ffe48a)}
.stars{color:#d9a400;letter-spacing:1px;font-size:16px}
.stars .off{color:#d6cdb8}
.navrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.navrow .btn{flex-direction:column;gap:2px;min-height:82px;font-size:16px}
.navrow .btn span{font-size:28px}
.badge{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;border:2.5px solid var(--ink);border-radius:999px;min-width:26px;height:26px;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.rel{position:relative}

/* ---------- move screen ---------- */
.movehead{display:flex;align-items:center;gap:14px}
.movehead .ico{font-size:60px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.stepbtn{border:3px solid var(--ink);border-radius:22px;background:#fff;box-shadow:0 6px 0 var(--ink);padding:14px;cursor:pointer;text-align:center;font-weight:900}
.stepbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.stepbtn span{display:block;font-size:40px}
.stepbtn b{display:block;font-size:20px}
.stepbtn small{font-weight:800;color:var(--ink2);font-size:13px}
.stepbtn.done{background:#e7f8ec}
.stepbtn.locked{opacity:.4;cursor:default}

/* ---------- session ---------- */
.sess{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);gap:16px;align-items:stretch;min-height:100%}
.sbar{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.pdots{display:flex;gap:5px;flex-wrap:wrap}
.pdots i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}
.pdots i.ok{background:var(--green)}.pdots i.bad{background:var(--red)}.pdots i.help{background:var(--gold)}.pdots i.now{transform:scale(1.3)}
.arena{position:relative;min-height:300px;border:3px solid var(--ink);border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#fdf6e7 0 70%,#c99560 70%);box-shadow:0 6px 0 rgba(31,42,68,.85)}
.arena .fighter{position:absolute;bottom:6%;width:34%;max-width:200px;aspect-ratio:200/280}
.arena .fighter.p1{left:6%}
.arena .fighter.p2{right:6%}
.arena .stand{position:absolute;bottom:8%;right:8%;width:40%;height:46%}
.blocks{position:absolute;bottom:0;left:0;right:0;height:34%;display:flex;justify-content:space-between}
.blocks i{width:24%;height:100%;background:linear-gradient(180deg,#9aa0a8,#7d838c);border:3px solid #4a4f57;border-radius:6px}
.stack{position:absolute;left:4%;right:4%;bottom:34%;display:flex;flex-direction:column-reverse;gap:3px}
.board{position:relative;height:22px;border:3px solid #5b3a1c;border-radius:5px;background:repeating-linear-gradient(90deg,#e8c48c 0 18px,#ddb57a 18px 22px,#ebcb96 22px 40px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.m-oak .board{background:repeating-linear-gradient(90deg,#b07a45 0 18px,#a06c3a 18px 22px,#bb8650 22px 40px);border-color:#4a2a12}
.m-brick .board{height:28px;background:linear-gradient(90deg,#c0503a 0 48%,#7a2a1e 48% 52%,#c0503a 52%);border-color:#5a1c12}
.m-stone .board{height:28px;background:linear-gradient(180deg,#a7a9ad,#85878c);border-color:#45474c}
.m-ice .board{background:linear-gradient(180deg,rgba(200,240,255,.95),rgba(140,210,245,.9));border-color:#3a8cbf}
.m-glass .board{background:linear-gradient(135deg,#c4f3ff,#7fd6ff 40%,#e9fbff 60%,#7fd6ff);border-color:#2a7fa8}
.m-gold .board{background:linear-gradient(180deg,#ffe27a,#e0a91e);border-color:#8a5a00}
.board.broken{animation:none;visibility:hidden}
.half{position:absolute;top:0;height:100%;width:50%;border:inherit;background:inherit;border-radius:5px}
.piece{position:absolute;height:22px;border:3px solid #5b3a1c;border-radius:5px;pointer-events:none;z-index:4}
.chip-p{position:absolute;width:8px;height:8px;border-radius:2px;background:#c9965c;pointer-events:none;z-index:5}
.hitfx{position:absolute;font-weight:900;font-size:34px;color:var(--red);text-shadow:0 3px 0 #fff,0 0 12px #fff;pointer-events:none;z-index:6;animation:pop 1s ease forwards}
@keyframes pop{0%{transform:scale(.4);opacity:0}20%{transform:scale(1.2);opacity:1}100%{transform:translateY(-50px) scale(1);opacity:0}}
.qside{display:flex;flex-direction:column;gap:12px}
.qcard{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:14px 16px;box-shadow:0 6px 0 rgba(31,42,68,.85);text-align:center}
.qcard .qlabel{font-weight:800;color:var(--ink2);font-size:14px}
.qcard .q{font-weight:900;font-size:clamp(34px,5.4vw,58px);letter-spacing:-.5px;line-height:1.1;margin:4px 0}
.qcard .q.long{font-size:clamp(22px,3.4vw,32px)}
.ansbox{display:inline-block;min-width:150px;padding:4px 16px;border:3px dashed var(--ink2);border-radius:16px;font-weight:900;font-size:clamp(30px,4.4vw,46px);min-height:62px;background:#fffdf6}
.ansbox.ok{border-color:var(--green);border-style:solid;background:#e3f7e9;color:var(--green)}
.ansbox.bad{border-color:var(--red);border-style:solid;background:#fde6e6;color:var(--red);animation:wob .35s}
@keyframes wob{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:62px;border:3px solid var(--ink);border-radius:16px;background:#fff;font-size:28px;font-weight:900;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:#fff4cc}
.pad .go{background:var(--green);color:#fff}
.pad .del{background:#ffe0e0}
.ynpad{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ynpad button{min-height:90px;font-size:30px}
.helpbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.timer{font-weight:900;font-size:16px}

/* help overlay */
.helpbox{background:#fffef8;border:3px solid var(--ink);border-radius:24px;padding:14px;box-shadow:0 6px 0 rgba(31,42,68,.85)}
.helpbox .lvl{display:inline-block;font-weight:900;font-size:13px;background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.steplist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.steplist div{font-weight:800;font-size:17px;padding:6px 10px;border-radius:12px;background:#f3ecdc}
.steplist div.cur{background:#fff3c4;border:2px solid var(--gold2)}
.steplist div.done{background:#e3f7e9;color:#1d6e3b}
.vis{margin:8px auto;max-width:640px}
.vnote{text-align:center;font-weight:800;color:var(--ink2);font-size:15px}
.frames{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.tf{display:grid;grid-template-columns:repeat(5,40px);grid-template-rows:repeat(2,40px);gap:4px;padding:6px;border:3px solid var(--ink);border-radius:12px;background:#fff}
.tf i{border:2px dashed #c9bfa8;border-radius:50%;transition:all .3s}
.tf i.ca{background:#3a7bdc;border:2px solid #1d3f7a}
.tf i.cb{background:#ff8a3c;border:2px solid #a24a0e}
.tf i.cx{background:#ddd;border:2px solid #999;position:relative}
.tf i.cx::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:900;font-size:22px}
.line svg{width:100%;height:auto;display:block}
.line .lt{font:800 15px var(--font);fill:#2b3550}
.line .jl{font:900 14px var(--font);fill:#2b3550}
.line .jump{stroke-dasharray:600;stroke-dashoffset:600;animation:draw .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.area{display:inline-block;width:100%;max-width:440px}
.area .atop{display:grid;margin-left:44px;text-align:center;font-weight:900;font-size:15px;color:var(--ink2)}
.area .amid{display:flex}
.area .aleft{display:grid;width:44px;font-weight:900;font-size:15px;color:var(--ink2);align-items:center;text-align:center}
.area .agrid{flex:1;display:grid;gap:3px;min-height:120px;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--ink)}
.area .ac{display:flex;align-items:center;justify-content:center;font-size:20px;min-height:46px}
.groups{display:flex;flex-direction:column;gap:4px;align-items:center}
.grow{display:flex;gap:4px;padding:3px 6px;border:2px solid #c9bfa8;border-radius:10px;background:#fff}
.grow i{width:14px;height:14px;border-radius:50%;background:#3a7bdc}
.grow.dim{opacity:.3}

<body>
<div id="bg"><div class="banner l">数学</div><div class="banner r">道場</div>
<div class="win"><svg viewBox="0 0 520 236" preserveAspectRatio="xMidYMax slice"><polygon points="0,236 90,110 150,160 230,60 320,170 390,100 520,200 520,236" fill="#7aa3c9"/><polygon points="230,60 250,90 215,92" fill="#fff"/><polygon points="390,100 405,122 375,122" fill="#fff"/><polygon points="0,236 120,170 200,210 300,150 420,210 520,180 520,236" fill="#4f7a5a"/><circle cx="440" cy="50" r="24" fill="#ffe08a"/></svg></div></div>
<div id="app"></div>
<script>
/* ================= NUMBER DOJO · MATH ENGINE =================
   Pure logic: belts, moves, problem generators, guided steps, visuals.
   Every problem: {move, q, ans, kind:'num'|'yn', hint, steps:[{p,a,kind?,v?}], v0, size}
   Steps break the problem down; the last step's answer always equals the full answer.
*/
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>typeof n==='number'?n.toLocaleString('en-US'):n;
const T=(n)=>Math.floor(n/10)*10, O=(n)=>n%10;

/* ---------- visual helpers ---------- */
// ten-frame state: arrays of 10 cells: 0 empty, 'a' first color, 'b' second color, 'x' crossed out
function frameOf(nA,nB,crossed){const c=[];for(let i=0;i<10;i++)c.push(i<nA?'a':i<nA+nB?'b':0);if(crossed)for(let i=0;i<crossed;i++){const k=9-i;if(c[k])c[k]='x'}return c}
const V={
  frames:(frames,note)=>({type:'frames',frames,note}),
  line:(from,to,jumps,mark)=>({type:'line',from,to,jumps:jumps||[],mark}),
  area:(rows,cols,vals,note)=>({type:'area',rows,cols,vals,note}),
  groups:(g,each,note,hl)=>({type:'groups',g,each,note,hl}),
  bar:(total,parts,note)=>({type:'bar',total,parts,note}),
  digits:(digits,note,hl)=>({type:'digits',digits,note,hl}),
  eq:(text)=>({type:'eq',text})
};
function lineRange(lo,hi){const span=hi-lo;let step=span<=20?1:span<=60?5:span<=200?10:span<=1200?100:1000;const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step;return [a===b?a-step:a,b]}

/* ---------- small multiplication helper (used by Flip It, Tricky Facts) ---------- */
function multSteps(b,a){ // b is the small factor we have a move for
  const p=a*b;
  if(b===2)return[{p:`Double ${a} = ?`,a:p}];
  if(b===3)return[{p:`Double ${a} = ?`,a:2*a},{p:`${2*a} + ${a} = ?`,a:p}];
  if(b===4)return[{p:`Double ${a} = ?`,a:2*a},{p:`Double ${2*a} = ?`,a:p}];
  if(b===5)return[{p:`${a} × 10 = ?`,a:10*a},{p:`Half of ${10*a} = ?`,a:p}];
  if(b===10)return[{p:`${a} with a zero on the end = ?`,a:p}];
  if(b===9)return[{p:`${a} × 10 = ?`,a:10*a},{p:`${10*a} − ${a} = ?`,a:p}];
  if(b===6)return[{p:`5 × ${a} = ?`,a:5*a},{p:`${5*a} + ${a} = ?`,a:p}];
  return[{p:`${b} × ${a} = ?`,a:p}];
}

/* ================= BELTS ================= */
const BELTS=[
  {id:'white', name:'White Belt', color:'#f4f1e8', ink:'#3b3b3b', goal:'Add within 20 instantly', material:'pine'},
  {id:'yellow',name:'Yellow Belt',color:'#ffd84a', ink:'#5a4300', goal:'Subtract within 20, add & subtract to 100', material:'pine'},
  {id:'orange',name:'Orange Belt',color:'#ff9a3c', ink:'#5a2a00', goal:'×2, ×3, ×4, ×5, ×10 fast', material:'oak'},
  {id:'green', name:'Green Belt', color:'#3cc46a', ink:'#0d3a1c', goal:'All the times tables and dividing', material:'oak'},
  {id:'blue',  name:'Blue Belt',  color:'#3a8cff', ink:'#06264f', goal:'Add & subtract 3-digit numbers in your head', material:'brick'},
  {id:'purple',name:'Purple Belt',color:'#9b5cff', ink:'#2a0c5a', goal:'Multiply big numbers by one digit', material:'brick'},
  {id:'brown', name:'Brown Belt', color:'#9a6234', ink:'#2e1606', goal:'2-digit × 2-digit in your head', material:'stone'},
  {id:'red',   name:'Red Belt',   color:'#ef3b3b', ink:'#4a0606', goal:'Percents of any number', material:'ice'},
  {id:'black', name:'Black Belt', color:'#1b1b1f', ink:'#ffffff', goal:'Master mix with big numbers', material:'glass'}
];

/* ================= MOVES =================
   gen() returns a problem. pre = prerequisite move (for "go back a step").
   target = seconds for a 3-board break in training.
*/
const MOVES=[];
const M=(o)=>{MOVES.push(o);return o};

/* ---------- WHITE ---------- */
M({id:'tenfriends',belt:'white',name:'Ten Friends',icon:'🤝',target:3,
  teach:'Ten Friends are pairs that make 10: 1+9, 2+8, 3+7, 4+6, 5+5. Know them by heart and lots of math gets easy.',
  gen(){const a=ri(1,9),b=10-a;return{q:`${a} + ? = 10`,ans:b,hint:`What goes with ${a} to make 10? Count up from ${a}.`,
    v0:V.frames([frameOf(a,0)],`${a} dots. How many empty spots?`),
    steps:[{p:`Count the empty spots: ${a} + ? = 10`,a:b,v:V.frames([frameOf(a,b)],`${a} + ${b} = 10`)}],size:10}}});
M({id:'counton',belt:'white',name:'Count On',icon:'👉',target:3,pre:'tenfriends',
  teach:'Start at the BIG number and count up the small one. 12 + 3: start at 12, then 13, 14, 15.',
  gen(){const a=ri(4,16),b=ri(1,3);if(Math.random()<.3)return this.wrap(b,a);return this.wrap(a,b)},
  wrap(a,b){const big=Math.max(a,b),sm=Math.min(a,b),ans=a+b,steps=[];for(let i=1;i<=sm;i++)steps.push({p:`${big+i-1} + 1 = ?`,a:big+i,v:V.line(...lineRange(big-1,ans+1),[{from:big,to:big+i,label:`+${i}`}],big+i)});
    return{q:`${a} + ${b}`,ans,hint:`Start at ${big} and count up ${sm}.`,v0:V.line(...lineRange(big-1,ans+1),[],big),steps,size:ans}}});
M({id:'doubles',belt:'white',name:'Doubles',icon:'👯',target:3,
  teach:'A double is a number plus itself: 6 + 6 = 12. For big doubles, split each number into 5 and the rest. 8 + 8 → (5+5) and (3+3) → 10 and 6 → 16.',
  gen(){const a=ri(2,10),ans=2*a;
    if(a<=5)return{q:`${a} + ${a}`,ans,hint:`Same number twice. Think of ${a} pairs.`,v0:V.frames([frameOf(a,0),frameOf(0,a)]),steps:[{p:`${a} + ${a} = ?`,a:ans,v:V.frames([frameOf(a,0),frameOf(0,a)],`${a} + ${a} = ${ans}`)}],size:ans};
    const r=a-5;return{q:`${a} + ${a}`,ans,hint:`Split each ${a} into 5 and ${r}. 5 + 5 = 10.`,v0:V.frames([frameOf(a,0),frameOf(0,a)]),
      steps:[{p:`5 + 5 = ?`,a:10,v:V.frames([frameOf(5,0),frameOf(0,5)],'5 + 5 = 10')},{p:`${r} + ${r} = ?`,a:2*r,v:V.frames([frameOf(a,0),frameOf(0,a)],`${r} + ${r} = ${2*r}`)},{p:`10 + ${2*r} = ?`,a:ans,v:V.eq(`${a} + ${a} = ${ans}`)}],size:ans}}});
M({id:'neardoubles',belt:'white',name:'Near Doubles',icon:'🪞',target:3,pre:'doubles',
  teach:'6 + 7 is almost a double! Do 6 + 6 = 12, then one more: 13.',
  gen(){const a=ri(2,9),x=Math.random()<.5?[a,a+1]:[a+1,a],ans=2*a+1;
    return{q:`${x[0]} + ${x[1]}`,ans,hint:`Use the double: ${a} + ${a}, then add 1.`,v0:V.frames([frameOf(x[0],0),frameOf(0,x[1])]),
      steps:[{p:`Double: ${a} + ${a} = ?`,a:2*a,v:V.frames([frameOf(a,0),frameOf(0,a)],`${a} + ${a} = ${2*a}`)},{p:`${2*a} + 1 = ?`,a:ans,v:V.eq(`${x[0]} + ${x[1]} = ${ans}`)}],size:ans}}});
M({id:'maketen',belt:'white',name:'Make Ten',icon:'🔟',target:4,pre:'tenfriends',
  teach:'凑十法 — the Make Ten move. 9 + 5: give 1 from the 5 to the 9 to make 10. What is left? 4. So 10 + 4 = 14.',
  gen(){const big=ri(6,9),small=ri(11-big,9),need=10-big,rest=small-need,ans=big+small,x=Math.random()<.65?[big,small]:[small,big];
    return{q:`${x[0]} + ${x[1]}`,ans,hint:`${big} needs ${need} to make 10. Take ${need} from ${small}.`,
      v0:V.frames([frameOf(big,0),frameOf(0,small)],`${big} and ${small}`),
      steps:[{p:`How much does ${big} need to make 10?`,a:need,v:V.frames([frameOf(big,need),frameOf(0,rest)],`Move ${need} over to make a ten`)},
             {p:`Take ${need} from ${small}. What is left?`,a:rest,v:V.frames([frameOf(10,0),frameOf(0,rest)],`A full ten and ${rest} left`)},
             {p:`10 + ${rest} = ?`,a:ans,v:V.eq(`${x[0]} + ${x[1]} = ${ans}`)}],size:ans}}});

/* ---------- YELLOW ---------- */
function subPair(regroup){for(;;){const c=ri(11,18),b=ri(2,9),d=c-b;if(d<1||d>9)continue;if(regroup&&b<=c-10)continue;return[c,b]}}
M({id:'thinkadd',belt:'yellow',name:'Think Addition',icon:'🔄',target:4,pre:'maketen',
  teach:'想加算减 — to subtract, think addition! 15 − 7: ask "7 plus what makes 15?" 7 + 3 = 10, + 5 more = 15. So the answer is 8.',
  gen(){const[c,b]=subPair(true),ans=c-b,up1=10-b,up2=c-10;
    return{q:`${c} − ${b}`,ans,hint:`Ask: ${b} + ? = ${c}. Jump up to 10 first.`,v0:V.line(...lineRange(b-1,c+1),[],b),
      steps:[{p:`${b} + ? = 10`,a:up1,v:V.line(...lineRange(b-1,c+1),[{from:b,to:10,label:`+${up1}`}],10)},
             {p:`10 + ? = ${c}`,a:up2,v:V.line(...lineRange(b-1,c+1),[{from:b,to:10,label:`+${up1}`},{from:10,to:c,label:`+${up2}`}],c)},
             {p:`${up1} + ${up2} = ?`,a:ans,v:V.eq(`${c} − ${b} = ${ans}`)}],size:c}}});
M({id:'breakten',belt:'yellow',name:'Break the Ten',icon:'🪓',target:4,pre:'tenfriends',
  teach:'破十法 — Break the Ten. 13 − 8: split 13 into 10 and 3. Take 8 from the 10: 2 left. Add the 3 back: 5.',
  gen(){const[c,b]=subPair(true),ones=c-10,ans=c-b;
    return{q:`${c} − ${b}`,ans,hint:`Split ${c} into 10 and ${ones}. Take ${b} from the 10.`,v0:V.frames([frameOf(10,0),frameOf(0,ones)],`${c} = 10 and ${ones}`),
      steps:[{p:`Split ${c} into 10 and ?`,a:ones,v:V.frames([frameOf(10,0),frameOf(0,ones)],`10 and ${ones}`)},
             {p:`10 − ${b} = ?`,a:10-b,v:V.frames([frameOf(10,0,b),frameOf(0,ones)],`Cross out ${b} from the ten`)},
             {p:`${10-b} + ${ones} = ?`,a:ans,v:V.eq(`${c} − ${b} = ${ans}`)}],size:c}}});
M({id:'downten',belt:'yellow',name:'Down to Ten',icon:'⬇️',target:4,pre:'tenfriends',
  teach:'平十法 — Down to Ten. 13 − 5: first take 3 to land on 10. You still need to take 2 more: 10 − 2 = 8.',
  gen(){const[c,b]=subPair(true),first=c-10,more=b-first,ans=c-b;
    return{q:`${c} − ${b}`,ans,hint:`Jump down to 10 first (take ${first}), then take the rest.`,v0:V.line(...lineRange(ans-1,c+1),[],c),
      steps:[{p:`${c} − ? = 10`,a:first,v:V.line(...lineRange(ans-1,c+1),[{from:c,to:10,label:`−${first}`}],10)},
             {p:`You took ${first}. How much more to take away? ${b} − ${first} = ?`,a:more,v:V.line(...lineRange(ans-1,c+1),[{from:c,to:10,label:`−${first}`}],10)},

M({id:'addtens',belt:'yellow',name:'Tens Then Ones',icon:'➕',target:6,pre:'counton',

M({id:'x10',belt:'orange',name:'Times 10',icon:'🔟',target:3,

M({id:'x5',belt:'orange',name:'Times 5',icon:'🖐️',target:5,pre:'x10',

M({id:'x4',belt:'orange',name:'Double Double',icon:'⏫',target:5,pre:'x2',

M({id:'x3',belt:'orange',name:'Double Plus One',icon:'3️⃣',target:5,pre:'x2',

M({id:'x9',belt:'green',name:'Nine Trick',icon:'9️⃣',target:5,pre:'x10',

M({id:'x78',belt:'green',name:'Tricky 7s and 8s',icon:'🎯',target:7,pre:'x4',

M({id:'divide',belt:'green',name:'Think Multiply',icon:'➗',target:6,pre:'flip',

M({id:'placeadd',belt:'blue',name:'Big Adding',icon:'🏗️',target:9,pre:'addtens',

M({id:'x11',belt:'purple',name:'Eleven Trick',icon:'🎩',target:7,pre:'placeadd',

M({id:'x25',belt:'purple',name:'Times 25',icon:'🪙',target:8,pre:'x4',

M({id:'divrules',belt:'brown',name:'Divide Detective',icon:'🔍',target:6,pre:'divide',
  teach:'Check without dividing! ÷2: last digit even. ÷5: ends in 0 or 5. ÷3 or ÷9: add up the digits — if the sum divides, the whole number does.',
  gen(){const d=pick([2,3,5,9,3,9]),want=Math.random()<.5;let n,ok;for(let i=0;i<200;i++){n=ri(102,9999);ok=n%d===0;if(ok===want)break}

function renderVis(v){
  if(!v)return '';
  const note=v.note?`<div class="vnote">${v.note}</div>`:'';
  switch(v.type){
    case 'frames':return `<div class="vis frames">${v.frames.map(f=>`<div class="tf">${f.map(c=>`<i class="${c?'c'+c:''}"></i>`).join('')}</div>`).join('')}</div>${note}`;
    case 'line':{
      const W=640,H=150,pad=34,lo=v.from,hi=v.to,sx=x=>pad+(x-lo)/(hi-lo)*(W-2*pad),span=hi-lo;
      const step=span<=20?1:span<=60?5:span<=200?10:span<=1200?100:1000,lab=span<=20?(span<=12?1:2):step*(span/step>12?2:1);
      let t='';for(let x=Math.ceil(lo/step)*step;x<=hi;x+=step){const big=x%lab===0;t+=`<line x1="${sx(x)}" y1="${100-(big?10:6)}" x2="${sx(x)}" y2="${100+(big?10:6)}" stroke="#2b3550" stroke-width="${big?2.5:1.5}"/>${big?`<text x="${sx(x)}" y="132" text-anchor="middle" class="lt">${fmt(x)}</text>`:''}`}
      let j='';(v.jumps||[]).forEach((k,i)=>{const x1=sx(k.from),x2=sx(k.to),mx=(x1+x2)/2,h=Math.min(70,22+Math.abs(x2-x1)*.35),up=k.to>=k.from;
        j+=`<path d="M${x1} 96 Q${mx} ${96-h*1.6} ${x2} 96" fill="none" stroke="${up?'#ff8a3c':'#3a8cff'}" stroke-width="4" stroke-linecap="round" class="jump" style="animation-delay:${i*.25}s"/><polygon points="${x2-6},${86} ${x2+6},${86} ${x2},${97}" fill="${up?'#ff8a3c':'#3a8cff'}"/><rect x="${mx-26}" y="${96-h*.8-30}" width="52" height="24" rx="12" fill="#fff" stroke="${up?'#ff8a3c':'#3a8cff'}" stroke-width="2"/><text x="${mx}" y="${96-h*.8-13}" text-anchor="middle" class="jl">${k.label}</text>`});
      const m=v.mark!=null?`<circle cx="${sx(v.mark)}" cy="100" r="9" fill="#ffd23f" stroke="#2b3550" stroke-width="2.5"/>`:'';
      return `<div class="vis line"><svg viewBox="0 0 ${W} ${H}"><line x1="${pad-10}" y1="100" x2="${W-pad+10}" y2="100" stroke="#2b3550" stroke-width="3"/>${t}${j}${m}</svg></div>${note}`;}
    case 'area':{
      const cols=v.cols.map(c=>`${Math.max(.8,Math.sqrt(c.n))}fr`).join(' '),rows=v.rows.map(r=>`${Math.max(.8,Math.sqrt(r.n))}fr`).join(' ');
      const colors=['#ffe7c2','#cfe6ff','#d8f5df','#f6dcff'];
      let cells='';v.rows.forEach((r,i)=>v.cols.forEach((c,k)=>{const val=v.vals[i]?.[k];cells+=`<div class="ac" style="background:${colors[(i+k)%4]}">${val==null?'':`<b>${val==='?'?'?':fmt(val)}</b>`}</div>`}));
      return `<div class="vis area"><div class="atop" style="grid-template-columns:${cols}">${v.cols.map(c=>`<span>${c.l===''?'':fmt(c.l)}</span>`).join('')}</div><div class="amid"><div class="aleft" style="grid-template-rows:${rows}">${v.rows.map(r=>`<span>${r.l===''?'':fmt(r.l)}</span>`).join('')}</div><div class="agrid" style="grid-template-columns:${cols};grid-template-rows:${rows}">${cells}</div></div></div>${note}`;}
    case 'groups':{const g=Math.min(v.g,12),e=Math.min(v.each,12);let h='';for(let i=0;i<g;i++)h+=`<div class="grow ${v.hl!=null&&i>=v.hl?'dim':''}">${'<i></i>'.repeat(e)}</div>`;return `<div class="vis groups">${h}</div>${note}`}
    case 'bar':{const segs=Array.from({length:10},(_,i)=>`<i style="left:${i*10}%"></i>`).join('');
      const parts=(v.parts||[]).map((p,i)=>`<div class="bfill" style="width:${p.p}%;background:${['#ffb84a','#3a8cff','#3cc46a'][i%3]}"><span>${p.l}</span></div>`).join('');
      return `<div class="vis bar"><div class="btrack">${parts}${segs}</div><div class="blab"><span>0</span><span>100% = ${fmt(v.total)}</span></div></div>${note}`}
    case 'digits':return `<div class="vis digits">${v.digits.map((d,i)=>`<b class="${(v.hl||[]).includes(i)?'hl':''}">${d}</b>`).join('')}</div>${note}`;
    case 'eq':return `<div class="vis eq">${v.text}</div>`;
  }
  return '';
}

  streak:{n:0,last:''},records:{biggest:0,fast10:null,bestCombo:0},owned:{},equip:{material:null},stats:{solved:0,correct:0,time:0,sessions:0},placed:false,warm:'',rival:{}}}
function mr(id,p=P()){return p.moves[id]||(p.moves[id]={seen:0,tried:0,strong:0,sessions:0,correct:0,wrong:0,h:[0,0,0,0,0],best:null,ivl:0,next:''})}

function beltUnlocked(i,p=P()){return i===0||!!p.earned[BELTS[i-1].id]}
function moveUnlocked(id,p=P()){const m=MOVE[id],bi=beltIdx(m.belt);if(!beltUnlocked(bi,p))return false;const list=beltMoves(m.belt),k=list.indexOf(m);return k===0||mr(list[k-1].id,p).tried>0||mr(id,p).tried>0}
function beltReady(b,p=P()){return beltMoves(b).every(m=>mr(m.id,p).strong>=1)}
function curBelt(p=P()){for(let i=0;i<BELTS.length;i++)if(!p.earned[BELTS[i].id])return i;return BELTS.length-1}

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.15,slide=0,delay=0){const a=ac();if(!a||!SAVE.settings.sound)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.2,freq=900,delay=0){const a=ac();if(!a||!SAVE.settings.sound)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+delay)}
const sfx={
  tap(){tone(660,.05,'triangle',.06)},
  ok(){tone(660,.1,'triangle',.12);tone(990,.16,'triangle',.12,0,.08)},
  bad(){tone(220,.22,'sine',.12,-60)},
  chop(n=1){noise(.08,.25,2400);for(let i=0;i<n;i++){noise(.22,.32,700,.06+i*.05);tone(120,.18,'square',.08,-60,.06+i*.05)}},
  hint(){tone(520,.12,'sine',.08,120)},
  coin(){tone(988,.08,'square',.06);tone(1319,.14,'square',.06,0,.07)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.13,0,i*.12))},
  fanfare(){[392,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.13,0,i*.14));noise(.6,.1,500,.9)},
  gong(){tone(110,1.6,'sine',.2,-20);tone(220,1.2,'sine',.08,-30);noise(.4,.08,300)}
};
function speak(t){if(!SAVE.settings.speak||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,'').replace(/×/g,' times ').replace(/−/g,' minus ').replace(/÷/g,' divided by ').replace(/%/g,' percent').replace(/\?/g,' what? '));u.rate=.95;speechSynthesis.speak(u)}catch(e){}}

let hubBelt=null,hubPicked=false;const NAV=[];
function suggestion(p=P()){
  const bi=curBelt(p),b=BELTS[bi];
  if(p.earned[b.id])return{type:'done',text:'You earned every belt! Keep your moves sharp.'};
  for(const m of beltMoves(b.id)){const r=mr(m.id,p);if(!r.tried)return{type:'learn',id:m.id,text:`Learn a new move: <b>${m.name}</b>`}}
  for(const m of beltMoves(b.id)){const r=mr(m.id,p);if(r.strong<1)return{type:'train',id:m.id,text:`Train <b>${m.name}</b> until you break 3 boards`}}
  return{type:'test',belt:b.id,text:`You are ready for the <b>${b.name} Challenge</b>!`};
}

   ${m.pre?`<div class="row center" style="margin-top:14px"><small style="font-weight:800;color:var(--ink2)">This move builds on <b>${MOVE[m.pre].name}</b>.</small><button class="btn small" id="pre">Practice ${MOVE[m.pre].name}</button></div>`:''}`);
  bind({'#back':()=>goHub(),'#w':()=>goWatch(id),'#t':()=>startTry(id),'#tr':()=>{if(!mr(id).tried){toast('Do the Try step first');return}startTrain(id)},'#pre':()=>startTry(m.pre,{returnTo:id})});
}

/* ================= WATCH (demo) ================= */
function goWatch(id,then){
  const m=MOVE[id],p=makeProblem(id);let k=-1;

   <div class="panel" style="margin-top:12px">${masterHTML(m.teach,'idle')}</div>
   <div class="panel" style="margin-top:14px;text-align:center"><div class="sub" style="margin:0">Watch me solve one:</div><div class="qcard" style="box-shadow:none;border:none"><div class="q ${p.q.length>14?'long':''}">${p.q}</div></div>
    <div id="vis">${renderVis(p.v0)}</div><div class="steplist" id="sl"></div>
    <div class="row center"><button class="btn big primary" id="nx">Show step 1 ▶</button></div></div>`);
  speak(m.teach);
  const draw=()=>{const sl=$('#sl');sl.innerHTML=p.steps.slice(0,k+1).map((s,i)=>`<div class="${i===k?'cur':'done'}">${reveal(s)}</div>`).join('');
    const v=k>=0?(p.steps[k].v||null):p.v0;if(v)$('#vis').innerHTML=renderVis(v);
    $('#nx').textContent=k<p.steps.length-1?`Show step ${k+2} ▶`:'Now you try! ✍️'};
  bind({'#back':()=>goMove(id),'#nx':()=>{if(k<p.steps.length-1){k++;draw();sfx.hint();speak(p.steps[k].p.replace('?',String(p.steps[k].a)))}else{mr(id).seen=1;persist();then?then():startTry(id)}}});
}

/* ================= SESSIONS =================
   modes: try (help ladder), train (boards, quick correction), test (belt challenge), place (placement), warm (daily), spar
*/
let S=null;
function newSession(o){return Object.assign({idx:0,results:[],input:'',phase:'answer',level:0,step:0,showCount:0,boards:0,combo:0,bestCombo:0,misses:0,times:[]},o)}
function startTry(id,opt={}){S=newSession({mode:'try',moveId:id,total:5,returnTo:opt.returnTo||null,gen:()=>makeProblem(id)});runSession()}
function startTrain(id){S=newSession({mode:'train',moveId:id,total:10,gen:()=>makeProblem(id)});runSession()}
function startTest(beltId){const ids=beltMoves(beltId).map(m=>m.id);const order=shuffle(ids.concat(Array.from({length:Math.max(0,12-ids.length)},()=>pick(ids))));
  S=newSession({mode:'test',beltId,total:12,order,gen:()=>makeProblem(S.order[S.idx%S.order.length])});runSession()}
function startPlacement(){const seq=[];BELTS.forEach(b=>PLACEMENT[b.id].forEach(id=>seq.push({belt:b.id,id})));
  S=newSession({mode:'place',seq,total:seq.length,passed:[],gen:()=>makeProblem(S.seq[S.idx].id)});runSession()}

function sessTitle(){const m=S.moveId?MOVE[S.moveId]:null;return S.mode==='try'?`✍️ Try: ${m.name}`:S.mode==='train'?`🪵 Train: ${m.name}`:S.mode==='test'?`🥋 ${BELTS[beltIdx(S.beltId)].name} Challenge`:S.mode==='place'?'📝 Quick test':S.mode==='warm'?'🔥 Daily warm-up':S.mode==='spar'?'🤜 Sparring':''}
function materialCls(){const p=P(),eq=p.equip.material;if(eq)return MATERIALS[eq].cls;const m=S.moveId?MOVE[S.moveId]:null,b=m?m.belt:S.beltId||BELTS[curBelt()].id;return MATERIALS[BELTS[beltIdx(b)].material].cls}

function runSession(){
  const p=P();
  APP.innerHTML=`<div class="screen" id="scr"><div class="wrap" style="max-width:1180px;margin-top:0"><div class="sess">
   <div class="sbar"><button class="iconbtn" id="quit" aria-label="Quit">✕</button><b style="font-size:18px">${sessTitle()}</b><div class="spacer"></div><div class="pdots" id="dots"></div></div>
   <div class="arena ${materialCls()}" id="arena"></div>
   <div class="qside"><div class="qcard"><div class="qlabel" id="ql"></div><div class="q" id="q"></div><div class="ansbox" id="ab"></div></div><div id="help"></div><div id="padwrap"></div><div class="helpbar" id="helpbar"></div></div>
  </div></div></div>`;
  $('#quit').addEventListener('click',()=>{sfx.tap();if(S&&S.idx>0&&S.mode!=='place'){modal(`<h2>Leave training?</h2><p class="sub">Your progress in this round won't count.</p><div class="row center" style="margin-top:14px"><button class="btn big" id="stay">Keep going</button><button class="btn big red" id="leave">Leave</button></div>`,m=>{m.querySelector('#stay').onclick=closeModal;m.querySelector('#leave').onclick=()=>{closeModal();exitSession()}})}else exitSession()});
  nextProblem();
}
function exitSession(){if(window.sparStop)sparStop();const s=S;S=null;if(!s)return goHub();if(s.mode==='try'||s.mode==='train')return goMove(s.moveId);if(s.mode==='place'){P().placed=true;persist()}goHub()}
function drawDots(){const d=$('#dots');if(!d)return;if(S.mode==='spar'){d.innerHTML='';return}let h='';for(let i=0;i<S.total;i++){const r=S.results[i];h+=`<i class="${r?r.ok?(r.help?'help':'ok'):'bad':''} ${i===S.idx?'now':''}"></i>`}d.innerHTML=h}
function drawArena(state){
  const a=$('#arena');if(!a)return;const p=P();
  const m=S.prob&&MOVE[S.prob.move],scroll=m?`<div class="scroll"><span>${m.icon}</span>${m.name}</div>`:'';
  if(S.mode==='try'){a.innerHTML=`${scroll}<div class="fighter p1 idle" id="me">${avatarSVG(lookOf(p))}</div><div class="fighter p2 idle flip" id="mstr">${avatarSVG(MASTER_LOOK)}</div>`;return}
  if(S.mode==='spar'&&window.sparArena)return sparArena(a);
  let boards='';for(let i=0;i<3;i++)boards+=`<div class="board" data-b="${i}"></div>`;
  a.innerHTML=`${scroll}<div class="fighter p1 idle" id="me">${avatarSVG(lookOf(p))}</div><div class="stand" id="stand"><div class="stack" id="stack">${boards}</div><div class="blocks"><i></i><i></i></div></div>`;
}
function nextProblem(){
  if(S.over||S.idx>=S.total)return finishSession();
  S.prob=S.gen();S.input='';S.phase='answer';S.level=0;S.step=0;S.t0=performance.now();S.helpUsed=false;S.showUsedThis=false;
  drawDots();drawArena();
  $('#ql').textContent=S.mode==='place'?`Question ${S.idx+1} of ${S.total}`:S.mode==='spar'?`Round ${S.idx+1} · answer before ${S.rival.name}!`:`Problem ${S.idx+1} of ${S.total}`;
  const q=$('#q');q.textContent=S.prob.q;q.className='q'+(S.prob.q.length>16?' long':'');
  $('#help').innerHTML='';drawInput();drawHelpBar();speak(S.prob.q);
  if(S.mode==='spar')sparStart();
}
function drawHelpBar(){const hb=$('#helpbar');if(!hb)return;
  if(S.mode==='try'||S.mode==='train'){hb.innerHTML=`<button class="btn small" id="teach">🧑‍🏫 Teach me</button>${S.mode==='try'&&S.phase==='answer'?`<button class="btn small" id="hintb">💡 Hint</button>`:''}`;
    const t=$('#teach');t&&t.addEventListener('click',()=>{sfx.tap();if(S.phase==='show')return;S.helpUsed=true;if(S.mode==='train')S.trainHelp=true;enterShow()});
    const h=$('#hintb');h&&h.addEventListener('click',()=>{sfx.tap();S.helpUsed=true;if(S.level<1)S.level=1;showHint()})}
  else hb.innerHTML='';
}
function curKind(){if(S.phase==='steps'){const st=S.prob.steps[S.step];return st.kind||'num'}return S.prob.kind}
function drawInput(){
  const pw=$('#padwrap');if(!pw)return;const ab=$('#ab');ab.className='ansbox';
  if(S.phase==='show'||S.phase==='fix'){pw.innerHTML='';ab.textContent=S.phase==='fix'?fmt(S.prob.ans):'…';return}
  if(curKind()==='yn'){ab.textContent=S.input||'?';pw.innerHTML=`<div class="ynpad"><button class="btn big green" data-yn="yes">Yes ✓</button><button class="btn big red" data-yn="no">No ✕</button></div>`;
    pw.querySelectorAll('[data-yn]').forEach(b=>b.addEventListener('click',()=>{ac();S.input=b.dataset.yn;submit()}));return}
  ab.textContent=S.input?fmt(Number(S.input)):' ';
  pw.innerHTML=`<div class="pad">${[7,8,9,4,5,6,1,2,3].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button class="del" data-n="del">⌫</button><button data-n="0">0</button><button class="go" data-n="go">✓</button></div>`;
  pw.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();ac();key(b.dataset.n)}));
}
function key(k){if(!S||S.lock)return;if(S.phase==='show'||S.phase==='fix')return;if(curKind()==='yn')return;
  if(k==='del'){S.input=S.input.slice(0,-1);sfx.tap()}else if(k==='go'){if(S.input!=='')submit();return}else if(/^\d$/.test(k)){if(S.input.length<7){S.input=(S.input==='0'?'':S.input)+k;sfx.tap()}}
  const ab=$('#ab');if(ab){ab.className='ansbox';ab.textContent=S.input?fmt(Number(S.input)):' '}}
document.addEventListener('keydown',e=>{if(!S||$('#modal'))return;if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace'){e.preventDefault();key('del')}else if(e.key==='Enter'){key('go')}
  else if(curKind&&S&&curKind()==='yn'&&(e.key==='y'||e.key==='n')){S.input=e.key==='y'?'yes':'no';submit()}});

function val(){return curKind()==='yn'?S.input:Number(S.input)}
function submit(){
  if(!S||S.lock)return;const v=val(),ab=$('#ab');
  if(S.phase==='steps'){const st=S.prob.steps[S.step];
    if(v===st.a){sfx.ok();S.step++;S.input='';if(S.step>=S.prob.steps.length){problemDone(true);return}drawSteps();drawInput();return}
    sfx.bad();ab.className='ansbox bad';S.input='';
    if(!S.showUsedThis){setTimeout(()=>enterShow(),450);return}
    // already watched once: reveal this step and move on
    toast(`It's ${fmt(st.a)}. Keep going!`);S.step++;S.revealed=true;if(S.step>=S.prob.steps.length){problemDone(true);return}setTimeout(()=>{drawSteps();drawInput()},500);return}
  const ok=v===S.prob.ans,dt=(performance.now()-S.t0)/1000;
  if(ok){ab.className='ansbox ok';ab.textContent=fmt(S.prob.ans);problemDone(false,dt);return}
  ab.className='ansbox bad';sfx.bad();S.input='';pose('#me','pose-oops');
  if(S.mode==='try'){S.helpUsed=true;S.level++;if(S.level===1){showHint();setTimeout(drawInput,350)}else enterSteps();return}
  if(S.mode==='place'){record(false,dt);S.lock=true;setTimeout(()=>{S.lock=false;placementFail()},700);return}
  if(S.mode==='spar'){S.misses++;S.combo=0;record(false,dt);return sparPoint(false,dt)}
  // train / test / warm: immediate correction
  S.misses++;S.combo=0;record(false,dt);enterFix();
}
function pose(sel,cls,ms=900){const el=$(sel);if(!el)return;el.classList.remove('pose-chop','pose-kick','pose-punch','pose-bow','pose-cheer','pose-oops');void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el&&el.classList.remove(cls),ms)}
function showHint(){sfx.hint();$('#help').innerHTML=`<div class="helpbox"><span class="lvl">💡 Hint</span>${masterHTMLsmall(S.prob.hint)}</div>`;speak(S.prob.hint)}
function masterHTMLsmall(t){return `<div class="master" style="margin-top:8px"><div class="who idle" style="width:70px;height:98px">${avatarSVG(MASTER_LOOK)}</div><div class="bubble" style="font-size:17px">${t}</div></div>`}
function enterSteps(){S.phase='steps';S.step=0;S.input='';S.helpUsed=true;drawSteps();drawInput();drawHelpBar()}
function drawSteps(){const pr=S.prob,st=pr.steps[S.step];let v=pr.v0;for(let i=0;i<S.step;i++)if(pr.steps[i].v)v=pr.steps[i].v;
  $('#help').innerHTML=`<div class="helpbox"><span class="lvl">🪜 Step by step</span>${renderVis(v)}<div class="steplist">${pr.steps.map((s,i)=>i<S.step?`<div class="done">${reveal(s)} ✓</div>`:i===S.step?`<div class="cur">${fnum(s.p)}</div>`:'').join('')}</div></div>`;
  $('#ql').textContent=`Step ${S.step+1} of ${pr.steps.length} — type the answer to the yellow step`;speak(st.p)}
function enterShow(){S.phase='show';S.level=Math.max(S.level,3);S.showUsedThis=true;S.showCount++;S.helpUsed=true;let k=-1;const pr=S.prob;
  const draw=()=>{const v=k>=0?(pr.steps[k].v||null):pr.v0;
    $('#help').innerHTML=`<div class="helpbox"><span class="lvl">🧑‍🏫 Watch me</span>${masterHTMLsmall(k<0?MOVE[pr.move].teach:'Watch this step.')}<div id="sv">${renderVis(v||pr.v0)}</div><div class="steplist">${pr.steps.slice(0,k+1).map((s,i)=>`<div class="${i===k?'cur':'done'}">${reveal(s)}</div>`).join('')}</div><div class="row center"><button class="btn primary" id="snx">${k<pr.steps.length-1?`Show step ${k+2} ▶`:'Now you try ✍️'}</button></div></div>`;
    $('#snx').addEventListener('click',()=>{ac();if(k<pr.steps.length-1){k++;sfx.hint();speak(pr.steps[k].p.replace('?',String(pr.steps[k].a)));draw()}else{
      if(S.mode==='train'||S.mode==='warm'){S.misses++;record(false,99,true);S.lock=false;S.idx++;nextProblem();return}
      enterSteps()}})};
  $('#ql').textContent='Watch the move step by step';drawInput();drawHelpBar();draw();pose('#mstr','pose-bow',1200)}
function enterFix(){S.phase='fix';S.lock=false;const pr=S.prob;$('#helpbar').innerHTML='';
  $('#help').innerHTML=`<div class="helpbox"><span class="lvl">🧑‍🏫 Here's how</span><div class="steplist">${pr.steps.map(s=>`<div class="done">${reveal(s)}</div>`).join('')}</div><div class="row center"><button class="btn primary" id="got">Got it ▶</button></div></div>`;
  drawInput();$('#ql').textContent=`The answer is ${fmt(pr.ans)}`;
  $('#got').addEventListener('click',()=>{ac();sfx.tap();S.idx++;nextProblem()});
}
function record(ok,dt,help){S.results[S.idx]={ok,help:!!help||S.helpUsed,t:dt,move:S.prob.move};const r=mr(S.prob.move);if(ok)r.correct++;else r.wrong++;r.h[Math.min(4,S.level)]++;
  const p=P();p.stats.solved++;if(ok){p.stats.correct++;p.stats.time+=Math.min(dt,60);if(S.prob.kind==='num'&&!help&&!S.helpUsed&&S.prob.size>p.records.biggest)p.records.biggest=S.prob.size}}
function problemDone(viaSteps,dt){
  S.lock=true;dt=dt??(performance.now()-S.t0)/1000;const helped=viaSteps||S.helpUsed;
  record(true,dt,helped);sfx.ok();
  if(S.mode==='try'){pose('#me','pose-cheer',1400);pose('#mstr','pose-bow',1200);S.combo=0;
    $('#help').innerHTML=`<div class="helpbox">${masterHTMLsmall(helped?pick(['Yes! You did it step by step.','Great work! Now try the next one.','That is the move!']):pick(['Perfect!','Excellent! Fast and right.','A true student of the dojo!']))}</div>`;
    setTimeout(()=>{S.lock=false;S.idx++;if(S.showCount>=2&&MOVE[S.moveId].pre&&!S.offeredBack&&S.idx<S.total){S.offeredBack=true;offerBack()}else nextProblem()},helped?1300:900);return}
  if(S.mode==='place'){S.lock=false;const item=S.seq[S.idx];const limit=Math.max(12,MOVE[item.id].target*3);if(dt>limit){S.results[S.idx].ok=false;placementFail();return}
    S.idx++;if(S.idx%2===0)S.passed.push(item.belt);nextProblem();return}
  if(S.mode==='spar')return sparPoint(true,dt);
  // board break
  const m=MOVE[S.prob.move],n=dt<=m.target?3:dt<=m.target*2?2:1;S.combo++;S.bestCombo=Math.max(S.bestCombo,S.combo);S.boards+=n;S.times.push(dt);
  breakBoards(n,()=>{S.lock=false;S.idx++;nextProblem()});
}
function breakBoards(n,done){
  pose('#me',n===3?'pose-kick':'pose-chop',700);
  setTimeout(()=>{sfx.chop(n);const st=$('#stack'),ar=$('#arena');if(!st||!ar){done&&done();return}
    const boards=[...st.querySelectorAll('.board')].reverse().slice(0,n);const ab=ar.getBoundingClientRect();
    boards.forEach((b,i)=>{const r=b.getBoundingClientRect();const cs=getComputedStyle(b);
      for(const side of [-1,1]){const pc=document.createElement('div');pc.className='piece';pc.style.cssText=`left:${r.left-ab.left+(side>0?r.width/2:0)}px;top:${r.top-ab.top}px;width:${r.width/2}px;height:${r.height}px;background:${cs.background};border-color:${cs.borderColor};transition:transform .7s cubic-bezier(.2,.6,.4,1),opacity .7s`;ar.appendChild(pc);
        requestAnimationFrame(()=>{pc.style.transform=`translate(${side*(40+i*20)}px,${90+i*20}px) rotate(${side*(35+i*15)}deg)`;pc.style.opacity='0'});setTimeout(()=>pc.remove(),800)}
      for(let k=0;k<6;k++){const c=document.createElement('i');c.className='chip-p';c.style.left=(r.left-ab.left+r.width/2)+'px';c.style.top=(r.top-ab.top)+'px';c.style.transition='transform .6s ease-out,opacity .6s';ar.appendChild(c);requestAnimationFrame(()=>{c.style.transform=`translate(${(Math.random()-.5)*160}px,${-40-Math.random()*60}px) rotate(${Math.random()*360}deg)`;c.style.opacity='0'});setTimeout(()=>c.remove(),700)}
      b.classList.add('broken')});
    const fx=document.createElement('div');fx.className='hitfx';fx.textContent=n===3?'⚡ 3 BOARDS!':n===2?'2 boards!':'1 board';fx.style.left='48%';fx.style.top='14%';ar.appendChild(fx);setTimeout(()=>fx.remove(),1000);
    if(S.combo>=3&&S.combo%3===0){const c=document.createElement('div');c.className='hitfx';c.style.cssText='left:6%;top:4%;color:#c48f00';c.textContent=`🔥 ${S.combo} in a row!`;ar.appendChild(c);setTimeout(()=>c.remove(),1000);sfx.coin()}
    setTimeout(()=>done&&done(),850)},260);
}
function placementFail(){S.lock=true;finishPlacement()}
function offerBack(){const pre=MOVE[MOVE[S.moveId].pre];
  modal(`${masterHTML(`This move stands on <b>${pre.name}</b>. Let's power up that move first, then come back. Strong roots, strong tree!`,'idle')}<div class="row center" style="margin-top:14px"><button class="btn big primary" id="pw">Power up ${pre.icon}</button><button class="btn big" id="kg">Keep going</button></div>`,m=>{
    m.querySelector('#pw').onclick=()=>{closeModal();startTry(pre.id,{returnTo:S.moveId})};m.querySelector('#kg').onclick=()=>{closeModal();nextProblem()}})}

/* ---------- finish ---------- */
function finishSession(){
  const s=S,p=P();S=null;p.stats.sessions++;touchStreak(p);
  const ok=s.results.filter(r=>r&&r.ok).length,clean=s.results.filter(r=>r&&r.ok&&!r.help).length;
  if(s.mode==='try'){const r=mr(s.moveId);const first=!r.tried;r.tried=1;r.seen=1;p.coins+=5;persist();sfx.win();
    if(s.returnTo){modal(`${masterHTML(`Powered up! Now back to <b>${MOVE[s.returnTo].name}</b>.`,'idle pose-cheer')}<div class="row center" style="margin-top:14px"><button class="btn big primary" id="ok">Let's go ▶</button></div>`,m=>m.querySelector('#ok').onclick=()=>{closeModal();startTry(s.returnTo)});return}
    modal(`<h2 style="font-size:30px">${first?'New move learned!':'Nice practice!'}</h2><div style="font-size:64px">${MOVE[s.moveId].icon}</div><h3>${MOVE[s.moveId].name}</h3>
      <div class="statrow"><div class="stat"><b>${ok}/${s.total}</b><small>solved</small></div><div class="stat"><b>${clean}</b><small>without help</small></div><div class="stat"><b>+5</b><small>coins</small></div></div>
      <p class="sub">Now train it! Break 3 boards by answering fast.</p><div class="row center"><button class="btn big primary" id="tr">Train 🪵</button><button class="btn big" id="hb">Dojo</button></div>`,m=>{
      m.querySelector('#tr').onclick=()=>{closeModal();startTrain(s.moveId)};m.querySelector('#hb').onclick=()=>{closeModal();goHub()}});return}
  if(s.mode==='train'){const r=mr(s.moveId),m=MOVE[s.moveId],times=s.times,avg=times.length?times.reduce((a,b)=>a+b,0)/times.length:99;
    const strong=ok>=8&&avg<=m.target*1.8;r.sessions++;const before=Math.min(3,r.strong);
    if(strong){r.strong++;r.ivl=r.ivl?Math.min(32,r.ivl*2):1;r.next=addDays(today(),r.ivl)}else if(ok<6){r.ivl=0;r.next=today()}
    if(times.length&&(r.best==null||avg<r.best))r.best=+avg.toFixed(1);
    if(s.bestCombo>p.records.bestCombo)p.records.bestCombo=s.bestCombo;
    const coins=s.boards+ok;p.coins+=coins;persist();const after=Math.min(3,r.strong);
    if(strong)sfx.win();if(after>before&&after===3){sfx.fanfare();confetti()}
    const advice=strong?(after>=3?'You mastered this move!':'Strong session! Train again to earn the next star.'):ok<6?'This one is tricky. Watch the move again, then try.':avg>m.target*1.8?'All right answers? Great. Now go a little faster to break more boards.':'Almost! Get 8 right to earn a star.';
    modal(`<h2 style="font-size:30px">${strong?'Strong session!':'Good training'}</h2><div class="bigstars">${'★'.repeat(after)}<span class="off">${'★'.repeat(3-after)}</span></div>

/* ---------- TIMES-TABLE CHANT (小九九) ---------- */
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

function chantLines(row){const L=[];if(row==='mix'){for(let b=2;b<=9;b++)for(let a=1;a<=b;a++)L.push([a,b]);return L}for(let a=1;a<=row;a++)L.push([a,row]);return L}
let C=null;

  const mx=p.chant.mix||{};

   <div class="panel" style="margin-top:12px">${masterHTML('In China, kids learn the <b>小九九</b> — "little nine-nine" — a times-table song. The trick: <b>always say the smaller number first</b>. Then 7 × 3 and 3 × 7 are the same line, so there are only <b>45 facts</b> to learn, not 81!')}</div>
   <div class="panel" style="margin-top:14px"><h3 style="font-size:20px">Pick a row</h3><div class="mgrid">${rows}<div class="mcard" data-row="mix"><div class="ico">🌀</div><div><b>All 45 facts</b>${starStr(mx.stars||0)}<br><small>Master mix</small></div></div></div></div>`);

}
function chantPlay(row,mode){chantStop();

}
function chantMiss(tapped){const [a,b]=C.lines[C.i];C.answered=true;C.combo=0;if(!tapped)sfx.bad();else sfx.bad();$('#cl').innerHTML=`${a} × ${b} = <b style="color:var(--green)">${a*b}</b>`;$('#cw').textContent=`Remember: ${words(a)} ${words(b)}${a>1?'s':''}, ${words(a*b)}`;
  if(C.bpm>72)C.bpm-=4}
function chantEnd(){if(!C)return;const p=P(),c=C;chantStop();p.chant=p.chant||{};
  if(c.mode==='listen'){sfx.win();modal(`<h2>Nice chanting!</h2><p class="sub">Say it out loud a few times. Then try the beat challenge.</p><div class="row center"><button class="btn big primary" id="pl">Beat challenge 🥁</button><button class="btn big" id="bk">Back</button></div>`,m=>{m.querySelector('#pl').onclick=()=>{closeModal();chantPlay(c.row,'play')};m.querySelector('#bk').onclick=()=>{closeModal();chantRow(c.row)}});return}

      return `<div class="bookcard ${got?'':'unk'} ${st>=3?'gold':''}" data-bm="${got?m.id:''}"><div class="bi">${got?m.icon:'❔'}</div><b>${got?m.name:'Secret move'}</b>${got?starStr(st):`<small>${b.name}</small>`}${got&&r.best?`<small>Best: ${r.best}s</small>`:''}</div>`}).join('');
    return `<div class="booksec"><div class="row"><span class="beltdot" style="background:${b.color}"></span><h3>${b.name}</h3><small>${b.goal}</small>${p.earned[b.id]?'<span class="chip">✓</span>':''}</div><div class="bookgrid">${cards}</div></div>`}).join('');
  screen(`<div class="row"><button class="iconbtn" id="back">←</button><h2 style="font-size:30px">📖 Move Book</h2><div class="spacer"></div><span class="chip">${have} / ${MOVES.length} collected</span><span class="chip">⭐ ${mast} mastered</span></div>
   <div class="panel" style="margin-top:12px">${sections}</div>`);
  bind({'#back':()=>goHub(),'[data-bm]':(e,el)=>{const id=el.dataset.bm;if(!id){toast('Keep training to discover this move');return}const m=MOVE[id],r=mr(id);
    modal(`<div style="font-size:60px">${m.icon}</div><h2>${m.name}</h2>${starStr(starsOf(id))}<div style="margin-top:10px;text-align:left">${masterHTML(m.teach)}</div>
      <div class="statrow"><div class="stat"><b>${r.correct}</b><small>solved</small></div><div class="stat"><b>${r.best?r.best+'s':'—'}</b><small>best avg</small></div><div class="stat"><b>${r.strong}</b><small>strong sessions</small></div></div>
      <div class="row center"><button class="btn big" id="w">👀 Watch</button><button class="btn big primary" id="t">🪵 Train</button><button class="btn big" id="c">Close</button></div>`,mm=>{
      mm.querySelector('#w').onclick=()=>{closeModal();goWatch(id,()=>goBook())};mm.querySelector('#t').onclick=()=>{closeModal();startTrain(id)};mm.querySelector('#c').onclick=closeModal})}});
}
NAV.push({id:'book',icon:'📖',label:'Move Book',show:()=>true,go:()=>goBook()});
window.__extras=window.__extras||{};Object.defineProperties(window.__extras,Object.getOwnPropertyDescriptors({goBook}));

/* ================= PHASE 4 · PERCENTS + BLACK BELT FINALE ================= */
const _beltCeremony=beltCeremony;
beltCeremony=function(b,score){
  const p=P();
  if(b.id==='red'){p.owned['band:gold']=1}
  if(b.id!=='black')return _beltCeremony(b,score);
  p.owned['gi:gold']=1;p.owned['band:rainbow']=1;p.owned['mat:gold']=1;p.coins+=200;p.grandmaster=today();persist();
  sfx.fanfare();setTimeout(()=>sfx.fanfare(),1600);confetti(160);
  modal(`<h2 style="font-size:36px">🥋 BLACK BELT 🥋</h2><div class="sub" style="margin-top:0">You are a Number Dojo Master</div>
   <div class="row center" style="gap:0"><div style="height:220px;width:150px" class="idle pose-cheer">${avatarSVG(lookOf(p))}</div><div style="height:220px;width:150px" class="idle pose-bow flip">${avatarSVG(MASTER_LOOK)}</div></div>
   ${masterHTML(`<b>${esc(p.name)}</b>, you started with Ten Friends. Now you solve percents, 2-digit times and 4-digit numbers in your head. I have nothing left to teach you — only practice keeps a master sharp.`,'idle')}
   <div class="statrow"><div class="stat"><b>${score}/12</b><small>final challenge</small></div><div class="stat"><b>+250</b><small>coins</small></div><div class="stat"><b>🏅</b><small>Gold uniform, gold boards and rainbow headband unlocked</small></div></div>
   <div class="row center"><button class="btn big primary" id="ok">Bow to the master</button></div>`,m=>m.querySelector('#ok').onclick=()=>{closeModal();hubBelt=null;goHub()});
};

/* ================= PHASE 5 · DAILY WARM-UP, SHOP, PARENTS, MUSIC ================= */

/* ---------- daily warm-up (spaced review) ---------- */
function dueMoves(p=P()){const t=today();return MOVES.filter(m=>{const r=mr(m.id,p);return r.tried&&(!r.next||r.next<=t)})}
function warmDone(p=P()){return p.warm===today()}
function startWarm(){const p=P();const tried=MOVES.filter(m=>mr(m.id,p).tried);if(!tried.length){toast('Learn your first move, then warm up tomorrow!');return}
  const due=dueMoves(p).map(m=>m.id);const pool=due.length?due.concat(due):[];tried.forEach(m=>pool.push(m.id));
  S=newSession({mode:'warm',total:12,due:new Set(due),gen:()=>makeProblem(pick(pool))});runSession()}
const _finishExtra=finishExtra;
finishExtra=function(s,ok){
  if(s.mode!=='warm')return _finishExtra(s,ok);
  const p=P(),t=today();
  // spaced review: correct on a move -> push its next review out; miss -> review again tomorrow
  const byMove={};s.results.forEach(r=>{if(!r)return;(byMove[r.move]=byMove[r.move]||[]).push(r.ok)});
  for(const id in byMove){const r=mr(id),allOk=byMove[id].every(Boolean);if(allOk){r.ivl=Math.min(32,Math.max(1,r.ivl||1)*2);r.next=addDays(t,r.ivl)}else{r.ivl=1;r.next=addDays(t,1)}}
  const first=p.warm!==t;p.warm=t;const coins=s.boards+ok+(first?15:0);p.coins+=coins;if(s.bestCombo>p.records.bestCombo)p.records.bestCombo=s.bestCombo;persist();sfx.win();if(ok>=11)confetti(40);
  modal(`<h2 style="font-size:30px">Warm-up done! 🔥</h2><div style="font-size:54px">🔥</div><h3>${p.streak.n} day streak</h3>
    <div class="statrow"><div class="stat"><b>${ok}/12</b><small>correct</small></div><div class="stat"><b>${s.boards}</b><small>boards broken</small></div><div class="stat"><b>+${coins}</b><small>coins${first?' (daily bonus)':''}</small></div></div>
    <p class="sub">${ok>=10?'Your moves are sharp. See you tomorrow!':'The moves you missed will come back tomorrow so they stick.'}</p><button class="btn big primary" id="hb">Back to the dojo</button>`,m=>m.querySelector('#hb').onclick=()=>{closeModal();goHub()});
};

/* ---------- shop ---------- */
const SHOP=[
  {id:'gi:black',type:'gi',k:'black',name:'Black uniform',cost:80},{id:'gi:teal',type:'gi',k:'teal',name:'Teal uniform',cost:80},
  {id:'gi:pink',type:'gi',k:'pink',name:'Pink uniform',cost:80},{id:'gi:purple',type:'gi',k:'purple',name:'Purple uniform',cost:80},
  {id:'gi:gold',type:'gi',k:'gold',name:'Gold uniform',cost:600,note:'or earn the Black Belt'},
  {id:'band:white',type:'band',k:'white',name:'White headband',cost:40},{id:'band:black',type:'band',k:'black',name:'Black headband',cost:40},
  {id:'band:gold',type:'band',k:'gold',name:'Gold headband',cost:150,note:'or earn the Red Belt'},{id:'band:rainbow',type:'band',k:'rainbow',name:'Rainbow headband',cost:400},
  {id:'mat:oak',type:'mat',k:'oak',name:'Oak boards',cost:60},{id:'mat:brick',type:'mat',k:'brick',name:'Bricks',cost:120},{id:'mat:stone',type:'mat',k:'stone',name:'Stone slabs',cost:160},
  {id:'mat:ice',type:'mat',k:'ice',name:'Ice blocks',cost:200},{id:'mat:glass',type:'mat',k:'glass',name:'Crystal',cost:260},{id:'mat:gold',type:'mat',k:'gold',name:'Gold bars',cost:500}
];
function goShop(){const p=P();
  const item=it=>{const own=!!p.owned[it.id],eq=it.type==='gi'?p.look.gi===it.k:it.type==='band'?p.look.band===it.k:p.equip.material===it.k;
    const swatch=it.type==='gi'?`<div class="shopsw" style="background:${GIS[it.k]}"></div>`:it.type==='band'?`<div class="shopsw band" style="background:${it.k==='rainbow'?'linear-gradient(90deg,#ff4d4d,#ffd23f,#3cc46a,#3a8cff)':BANDS[it.k]}"></div>`:`<div class="shopmat ${MATERIALS[it.k].cls}"><div class="board"></div><div class="board"></div></div>`;
    return `<div class="shopitem ${own?'own':''}">${swatch}<b>${it.name}</b>${it.note&&!own?`<small>${it.note}</small>`:''}
      ${own?`<button class="btn small ${eq?'green':''}" data-eq="${it.id}" ${eq?'disabled':''}>${eq?'Wearing':it.type==='mat'?'Use':'Wear'}</button>`:`<button class="btn small primary" data-buy="${it.id}" ${p.coins<it.cost?'disabled':''}>🪙 ${it.cost}</button>`}</div>`};
  const sec=(t,type)=>`<h3 style="font-size:20px;margin:14px 0 8px">${t}</h3><div class="shopgrid">${SHOP.filter(i=>i.type===type).map(item).join('')}</div>`;
  screen(`<div class="row"><button class="iconbtn" id="back">←</button><h2 style="font-size:30px">🏮 Dojo Shop</h2><div class="spacer"></div><span class="chip">🪙 ${p.coins}</span></div>
   <div class="panel" style="margin-top:12px"><div class="row" style="align-items:flex-start"><div style="width:130px;height:180px" class="idle">${avatarSVG(lookOf(p))}</div><div style="flex:1;min-width:220px">${masterHTML('Coins come only from training. Every coin here was earned with your brain!')}</div></div>
   ${sec('Uniforms','gi')}${sec('Headbands','band')}${sec('Boards to break','mat')}
   ${p.equip.material?`<div class="row" style="margin-top:12px"><button class="btn small" id="matreset">Use belt boards again</button></div>`:''}</div>`);
  bind({'#back':()=>goHub(),
    '[data-buy]':(e,el)=>{const it=SHOP.find(i=>i.id===el.dataset.buy);if(p.coins<it.cost)return;p.coins-=it.cost;p.owned[it.id]=1;applyItem(it);persist();sfx.coin();toast(`${it.name} unlocked!`);goShop()},
    '[data-eq]':(e,el)=>{applyItem(SHOP.find(i=>i.id===el.dataset.eq));persist();goShop()},
    '#matreset':()=>{p.equip.material=null;persist();goShop()}});
  function applyItem(it){if(it.type==='gi')p.look.gi=it.k;else if(it.type==='band')p.look.band=it.k;else p.equip.material=it.k}
}

/* ---------- parents ---------- */
function goParentsGate(){
  modal(`<h2>For grown-ups</h2><p class="sub">Press and hold the button for 3 seconds.</p><button class="btn big" id="hold" style="touch-action:none">Hold me</button><div class="bprogbar" style="margin:14px auto;max-width:280px"><i id="hp" style="width:0"></i></div><button class="btn small" id="cx">Cancel</button>`,m=>{
    let t=null,st=0;const btn=m.querySelector('#hold'),bar=m.querySelector('#hp');
    const down=e=>{e.preventDefault();st=performance.now();const tick=()=>{const k=(performance.now()-st)/3000;bar.style.width=Math.min(100,k*100)+'%';if(k>=1){closeModal();goParents();return}t=requestAnimationFrame(tick)};t=requestAnimationFrame(tick)};
    const up=()=>{cancelAnimationFrame(t);bar.style.width='0'};
    btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointerleave',up);btn.addEventListener('pointercancel',up);
    m.querySelector('#cx').onclick=closeModal})}
function goParents(){
  const p=P(),st=p.stats,acc=st.solved?Math.round(100*st.correct/st.solved):0,avg=st.correct?(st.time/st.correct).toFixed(1):'—';
  const belts=BELTS.map(b=>`<span class="chip" style="opacity:${p.earned[b.id]?1:.35}"><span class="beltdot" style="background:${b.color};width:22px;height:10px"></span>${b.name}${p.earned[b.id]?` · ${p.earned[b.id]}`:''}</span>`).join(' ');
  const rows=MOVES.filter(m=>mr(m.id,p).tried).map(m=>{const r=mr(m.id,p),tot=r.correct+r.wrong,a=tot?Math.round(100*r.correct/tot):0,deep=(r.h[2]||0)+(r.h[3]||0),stuck=tot>=6&&(a<70||deep>=4);
    return `<tr class="${stuck?'stuck':''}"><td>${m.icon} ${m.name}</td><td>${BELTS[beltIdx(m.belt)].name.replace(' Belt','')}</td><td>${starStr(starsOf(m.id))}</td><td>${tot}</td><td>${a}%</td><td>${r.best?r.best+'s':'—'}</td><td>${deep}</td><td>${stuck?'⚠️ Needs help':starsOf(m.id)>=3?'✅ Mastered':'Learning'}</td></tr>`}).join('');
  const stuckList=MOVES.filter(m=>{const r=mr(m.id,p),tot=r.correct+r.wrong,a=tot?r.correct/tot:1;return tot>=6&&(a<.7||(r.h[2]||0)+(r.h[3]||0)>=4)});
  screen(`<div class="row"><button class="iconbtn" id="back">←</button><h2 style="font-size:28px">👪 Progress for ${esc(p.name)}</h2></div>
   <div class="panel" style="margin-top:12px"><div class="statrow" style="justify-content:flex-start"><div class="stat"><b>${earnedCount(p)}</b><small>belts</small></div><div class="stat"><b>${MOVES.filter(m=>starsOf(m.id)>=3).length}/${MOVES.length}</b><small>moves mastered</small></div><div class="stat"><b>${fmt(st.solved)}</b><small>problems</small></div><div class="stat"><b>${acc}%</b><small>accuracy</small></div><div class="stat"><b>${avg}s</b><small>avg answer</small></div><div class="stat"><b>${p.streak.n}</b><small>day streak</small></div><div class="stat"><b>${fmt(p.records.biggest)}</b><small>biggest number solved</small></div></div>
    <div class="row" style="margin-top:6px">${belts}</div>
    ${stuckList.length?`<div class="helpbox" style="margin-top:12px"><b>Where ${esc(p.name)} needs help:</b> ${stuckList.map(m=>`${m.icon} ${m.name}`).join(', ')}. Sit together and tap <b>Watch</b> on these moves, then do a Try round side by side.</div>`:`<p class="sub">No trouble spots right now.</p>`}
    <div style="overflow-x:auto;margin-top:12px;touch-action:pan-x pan-y"><table class="ptable"><thead><tr><th>Move</th><th>Belt</th><th>Stars</th><th>Tries</th><th>Accuracy</th><th>Best avg</th><th>Step-by-step helps</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="8">No moves started yet.</td></tr>'}</tbody></table></div>
    <h3 style="margin-top:18px">How the game teaches</h3><p class="sub" style="font-weight:700">Each move is taught in order: <b>Watch</b> (the master demonstrates), <b>Try</b> (untimed, with a hint → step-by-step → full demo → practice the skill underneath), then <b>Train</b> (speed against their own best). Moves come back in the daily warm-up on a spaced schedule so they stick. Methods include the Chinese 凑十法 (make ten), 破十法 (break the ten), 平十法 (down to ten), 想加算减 (think addition) and the 小九九 times-table chant.</p>
    <div class="row" style="margin-top:16px"><button class="btn small red" id="reset">Reset ${esc(p.name)}'s progress</button><button class="btn small red" id="del">Delete student</button></div></div>`);
  bind({'#back':()=>goHub(),
    '#reset':()=>confirmBox(`Reset all of ${esc(p.name)}'s belts, moves and coins?`,()=>{const np=newProfile(p.name,p.look);np.id=p.id;Object.keys(p).forEach(k=>delete p[k]);Object.assign(p,np);persist();toast('Progress reset');goHub()}),
    '#del':()=>confirmBox(`Delete ${esc(p.name)} from this device?`,()=>{SAVE.profiles=SAVE.profiles.filter(x=>x.id!==p.id);SAVE.cur=null;persist();goProfiles()})});
}
function confirmBox(msg,yes){modal(`<h2>Are you sure?</h2><p class="sub">${msg} This can't be undone.</p><div class="row center"><button class="btn big" id="no">Cancel</button><button class="btn big red" id="yes">Yes</button></div>`,m=>{m.querySelector('#no').onclick=closeModal;m.querySelector('#yes').onclick=()=>{closeModal();yes()}})}

/* ---------- music (menus only, soft) ---------- */
let MUS=null;
const PENTA=[293.66,329.63,392,440,523.25,587.33,659.25];
function musicTick(){if(!SAVE.settings.music||!SAVE.settings.sound||S||(typeof C!=='undefined'&&C)||document.hidden)return;const a=AC;if(!a||a.state!=='running')return;
  const n=PENTA[Math.floor(Math.random()*PENTA.length)];tone(n,1.6,'triangle',.025);if(Math.random()<.35)tone(n/2,2.4,'sine',.02,0,.2)}
function musicStart(){if(!MUS)MUS=setInterval(musicTick,900)}
musicStart();
const _openSettings=openSettings;
openSettings=function(){_openSettings();const m=$('#modal');if(!m)return;const box=m.querySelector('div[style*="flex-direction:column"]');if(!box)return;
  const l=document.createElement('label');l.className='btn';l.style.justifyContent='space-between';l.innerHTML=`<span>🎵 Calm music in the dojo</span><input type="checkbox" id="s3" ${SAVE.settings.music?'checked':''} style="width:26px;height:26px">`;
  box.insertBefore(l,box.children[1]);l.querySelector('#s3').onchange=e=>{SAVE.settings.music=e.target.checked;persist()}};

const _suggestion=suggestion;
suggestion=function(p=P()){if(MOVES.some(m=>mr(m.id,p).tried)&&!warmDone(p)&&dueMoves(p).length)return{type:'warm',text:`Start with your <b>daily warm-up</b> — ${dueMoves(p).length} move${dueMoves(p).length>1?'s':''} to review`,btn:'Warm up 🔥',go:()=>startWarm()};return _suggestion(p)};
/* ---------- hub buttons ---------- */
NAV.unshift({id:'warm',icon:'🔥',label:'Daily warm-up',show:p=>MOVES.some(m=>mr(m.id,p).tried),badge:p=>warmDone(p)?0:'!',go:()=>startWarm()});
NAV.push({id:'shop',icon:'🏮',label:'Shop',show:()=>true,go:()=>goShop()});
NAV.push({id:'parents',icon:'👪',label:'Grown-ups',show:()=>true,go:()=>goParentsGate()});
window.__extras=window.__extras||{};Object.defineProperties(window.__extras,Object.getOwnPropertyDescriptors({startWarm,goShop,goParents,dueMoves}));

/* ---------- boot ---------- */
load();
if(P())goHub();else goProfiles();
if(/[?&]test\b/.test(location.search))window.__dojo={get S(){return S},P,SAVE:()=>SAVE,persist,goHub,goMove,goWatch,startTry,startTrain,startTest,startPlacement,MOVES,MOVE,BELTS,key,submit,mr};
if(window.__dojo&&window.__extras)Object.defineProperties(window.__dojo,Object.getOwnPropertyDescriptors(window.__extras));


</script>
