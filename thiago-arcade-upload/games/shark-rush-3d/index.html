<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="../icon-32.png">
<title>Shark Rush 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    --ink:#07172b;--foam:#f2f9ff;--sun:#ffcf4d;--danger:#ff3b5c;--coral:#ff6b35;--coral-dk:#d84f1f;--font:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
  body{height:100%;margin:0;background:#041226;color:var(--foam);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
  *{box-sizing:border-box}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;gap:12px;pointer-events:none;transition:opacity .3s}
  #hud.hidden{opacity:0}
  .hud-left{min-width:130px}
  #sharkName{font-weight:800;font-size:clamp(15px,2.2vw,22px);text-shadow:0 2px 8px rgba(0,0,0,.6);line-height:1.1}
  #levelLbl,#depthLbl{font-size:clamp(12px,1.5vw,14px);opacity:.85;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  #coins{font-size:clamp(13px,1.7vw,16px);font-weight:800;color:var(--sun);text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .hud-mid{flex:1;max-width:440px;padding-top:2px}
  .bar{position:relative;height:26px;border-radius:999px;background:rgba(2,12,30,.45);border:2px solid rgba(255,255,255,.45);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #barFill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#f5a623,#ffd66b);transition:width .25s ease-out;border-radius:999px}
  #barTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .bar.energy{height:14px;margin-top:6px}
  #energyFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#1fbf75,#8ff0b6);transition:width .3s;border-radius:999px}
  #energyFill.low{background:linear-gradient(90deg,#ef4444,#fb923c)}
  #energyTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
  #mathPill{margin:8px auto 0;width:max-content;max-width:100%;background:rgba(255,255,255,.93);color:var(--ink);border-radius:999px;padding:6px 18px;font-weight:700;font-size:clamp(15px,2vw,19px);box-shadow:0 4px 16px rgba(0,0,0,.4);transition:transform .2s,background .2s}
  #mathPill b{font-size:1.25em;color:#0b5c94}
  #mathPill.good{background:#c6f6d5;transform:scale(1.06)}#mathPill.bad{background:#fecaca}
  .hud-right{display:flex;align-items:center;gap:8px;pointer-events:auto}
  #hearts{font-size:clamp(20px,2.6vw,26px);letter-spacing:2px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
  .icon-btn{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(2,12,30,.45);color:#fff;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .icon-btn:active{transform:scale(.92)}
  /* controls */
  #controls{position:absolute;inset:0;pointer-events:none}
  #joyZone{position:absolute;left:0;top:30%;bottom:0;width:48%;pointer-events:auto;touch-action:none}
  #joy{position:absolute;width:140px;height:140px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(2,12,30,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transform:translate(-50%,-50%);display:none;pointer-events:none}
  #joyKnob{position:absolute;left:50%;top:50%;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.4);transform:translate(-50%,-50%)}
  #joyHint{position:absolute;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;text-align:center;opacity:.7;pointer-events:none;line-height:1.2}
  .abtn{position:absolute;right:calc(26px + env(safe-area-inset-right,0px));width:96px;height:96px;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(2,12,30,.45);color:#fff;font-family:var(--font);font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .abtn span{font-size:30px;line-height:1}
  .abtn.on{background:rgba(255,207,77,.85);color:var(--ink);transform:scale(.94)}
  #btnBoost{bottom:calc(34px + env(safe-area-inset-bottom,0px))}
  #btnBrake{bottom:calc(150px + env(safe-area-inset-bottom,0px));width:76px;height:76px;right:calc(38px + env(safe-area-inset-right,0px))}
  #btnBrake span{font-size:24px}
  .arrow{position:absolute;width:0;height:0;pointer-events:none;transform:translate(-50%,-50%);display:none}
  .arrow div{width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:30px solid #7dd3fc;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));position:absolute;left:-16px;top:-15px}
  .arrow b{position:absolute;left:-14px;top:14px;width:28px;text-align:center;background:#fff;color:var(--ink);border-radius:8px;font-size:13px;padding:1px 0}
  #combo{position:absolute;left:50%;top:22%;transform:translate(-50%,0) scale(0);color:var(--sun);font-weight:800;font-size:clamp(34px,6.5vw,66px);text-shadow:0 3px 0 #a86a00,0 10px 30px rgba(0,0,0,.6);pointer-events:none;opacity:0}
  #combo.pop{animation:pop .7s ease-out}
  @keyframes pop{0%{transform:translate(-50%,0) scale(.3);opacity:0}25%{transform:translate(-50%,-10px) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-40px) scale(1);opacity:0}}
  #hint{position:absolute;left:50%;top:26%;transform:translateX(-50%);background:rgba(2,12,30,.55);border:1px solid rgba(255,255,255,.35);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;font-size:clamp(14px,1.9vw,18px);white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:92%;text-overflow:ellipsis;overflow:hidden}
  #hint.show{opacity:1}
  .pop-txt{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8);pointer-events:none;animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
  .pop-txt.big{font-size:28px}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
  #hurtFlash{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,40,60,0),rgba(255,40,60,.55));opacity:0;pointer-events:none;transition:opacity .15s}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,rgba(12,80,130,.5),rgba(3,12,30,.9));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .35s;overflow:auto}
  .overlay.show{opacity:1;pointer-events:auto}
  .card{width:min(600px,100%);text-align:center;animation:rise .45s cubic-bezier(.2,.9,.3,1.1)}
  .card.wide{width:min(820px,100%)}
  @keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .title{font-weight:800;font-size:clamp(38px,7.5vw,72px);line-height:.95;margin:0;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.6);letter-spacing:-1px}
  .title.sm{font-size:clamp(30px,6vw,56px)}
  .sub{font-size:clamp(15px,2.1vw,19px);margin:12px 0 0;opacity:.95;font-weight:600;line-height:1.4}
  .preview{width:min(360px,80%);height:auto;margin:6px auto 4px;display:block;border-radius:16px}
  .howto{display:flex;justify-content:center;gap:10px;margin:16px 0 18px;flex-wrap:wrap}
  .how{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:12px 12px;width:142px;font-size:13px;font-weight:600;line-height:1.3}
  .how b{display:block;font-size:26px;margin-bottom:4px}
  .btn{font-family:var(--font);font-weight:800;font-size:clamp(20px,3.2vw,27px);color:#07172b;border:0;cursor:pointer;padding:16px 46px;min-height:64px;border-radius:999px;background:linear-gradient(180deg,#ffe08a,#f5b700);box-shadow:0 6px 0 #b98300,0 16px 34px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s;margin:6px}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b98300,0 8px 16px rgba(0,0,0,.4)}
  .btn:focus-visible{outline:4px solid #fff;outline-offset:3px}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35);font-size:clamp(16px,2.2vw,20px);min-height:54px;padding:12px 30px}
  .fact{background:rgba(255,255,255,.1);border:1px solid rgba(255,207,77,.6);border-radius:20px;padding:14px 18px;margin:12px auto 12px;font-size:clamp(15px,2.1vw,18px);line-height:1.4;max-width:520px;font-weight:500}
  .fact span{display:block;color:var(--sun);font-weight:800;font-size:13px;margin-bottom:4px}
  .stats{display:flex;justify-content:center;gap:10px;margin:8px 0 4px;flex-wrap:wrap}
  .stat{background:rgba(255,255,255,.1);border-radius:14px;padding:8px 14px;min-width:96px}
  .stat b{display:block;font-size:22px;color:var(--sun)}.stat small{font-size:12px;opacity:.85}
  .quiz{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:14px 16px;margin:10px auto 12px;max-width:520px;font-size:clamp(15px,2.1vw,18px);line-height:1.35}
  .quiz .qbtns{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .qbtn{font-family:var(--font);font-weight:800;font-size:24px;min-width:84px;min-height:56px;border-radius:16px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.15);color:#fff;cursor:pointer}
  .qbtn.ok{background:#22c55e;border-color:#fff}.qbtn.no{background:#ef4444;border-color:#fff}.qbtn:disabled{opacity:.75}
  .qmsg{margin-top:10px;font-weight:800;color:var(--sun);min-height:1.4em}
  .badge{display:inline-block;background:var(--sun);color:#5a3a00;font-weight:800;border-radius:999px;padding:6px 16px;font-size:15px;margin-bottom:6px}
  .ladder{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
  .rung{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.5)}
  .rung.done{background:var(--sun);border-color:#fff}.rung.now{background:#ff7a3d;border-color:#fff;transform:scale(1.35)}
  .best{opacity:.8;font-size:14px;margin-top:8px}
  .shop-sec{font-weight:800;font-size:18px;text-align:left;margin:16px 4px 8px;opacity:.9}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .item{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22);border-radius:20px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;line-height:1.25}
  .item.owned{border-color:rgba(255,207,77,.7)}
  .item .ic{font-size:30px}.item b{font-size:15px}.item .desc{opacity:.85;font-size:13px;min-height:2.5em}
  .item canvas{width:130px;height:72px;border-radius:10px}
  .tiers{display:flex;gap:4px;margin:2px 0}.tier{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5)}.tier.on{background:var(--sun);border-color:#fff}
  .buy{font-family:var(--font);font-weight:800;font-size:15px;color:#fff;border:0;border-radius:999px;padding:9px 16px;min-height:42px;cursor:pointer;background:linear-gradient(180deg,#ff8a4c,var(--coral));box-shadow:0 4px 0 var(--coral-dk);margin-top:4px;min-width:110px}
  .buy:disabled{background:rgba(255,255,255,.18);box-shadow:0 4px 0 rgba(0,0,0,.3);opacity:.7;cursor:default}
  .buy.eq{background:linear-gradient(180deg,#4ade80,#16a34a);box-shadow:0 4px 0 #14532d}
  .buy:active:not(:disabled){transform:translateY(3px);box-shadow:none}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;background:#041226}
  @media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">Filling the ocean…</div>
<div id="hurtFlash"></div>
<div id="hud" class="hidden">
  <div class="hud-left"><div id="sharkName">Dwarf Lanternshark</div><div id="levelLbl">Level 1 of 8</div><div id="depthLbl">Depth 10 m</div><div id="coins">🪙 0</div></div>
  <div class="hud-mid"><div class="bar"><div id="barFill"></div><span id="barTxt">0 / 100</span></div><div class="bar energy"><div id="energyFill"></div><span id="energyTxt">Energy</span></div><div id="mathPill">Find the fish with <b>8 + 7</b></div></div>
  <div class="hud-right"><div id="hearts">❤️❤️❤️</div><button class="icon-btn" id="btnMute" aria-label="Sound">🔊</button><button class="icon-btn" id="btnPause" aria-label="Pause">⏸</button></div>
</div>
<div id="controls">
  <div id="joyZone"></div>
  <div id="joyHint">Drag here<br>to steer</div>
  <div id="joy"><div id="joyKnob"></div></div>
  <div class="abtn" id="btnBrake"><span>🛑</span>Slow</div>
  <div class="abtn" id="btnBoost"><span>💨</span>Boost</div>
  <div class="arrow" id="ar0"><div></div><b>0</b></div><div class="arrow" id="ar1"><div></div><b>0</b></div><div class="arrow" id="ar2"><div></div><b>0</b></div>
</div>
<div id="combo"></div>
<div id="hint"></div>
<div id="pops"></div>
<div id="overlay" class="overlay"><div class="card" id="card"></div></div>
<script src="../skybreaker/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('loading').textContent='3D engine failed to load. Check your connection and reload.';return;}

/* ================= DATA ================= */
const SHARKS=[
 {name:'Dwarf Lanternshark',len:3.2,h:.34,w:.42,sn:.9,ft:1,mph:2,lbs:1,speed:14,top:'#3f4c66',belly:'#93a4c4',glow:true,fact:'The smallest shark in the world — only about as long as a banana! Its belly glows in the dark so predators can\'t spot it from below.'},
 {name:'Bamboo Shark',len:4.2,h:.36,w:.5,sn:.55,ft:3,mph:3,lbs:15,speed:15,top:'#8a6f48',belly:'#e3cf9f',bands:true,fact:'Bamboo sharks can "walk" across the sea floor with their fins, and can survive out of the water for hours at low tide.'},
 {name:'Blacktip Reef Shark',len:5,h:.5,w:.58,sn:1,ft:5,mph:15,lbs:40,speed:17,top:'#6d7b88',belly:'#e6ebef',blacktips:true,fact:'Named for the black tips on its fins. It patrols shallow coral reefs and sometimes leaps clean out of the water when hunting.'},
 {name:'Lemon Shark',len:5.8,h:.6,w:.68,sn:.8,ft:10,mph:10,lbs:200,speed:17,top:'#a08a52',belly:'#e8dcb0',fact:'Lemon sharks are yellow-brown so they can hide on sandy sea floors. They like to hang out in groups, like a friendly gang.'},
 {name:'Blue Shark',len:6.6,h:.58,w:.62,sn:1.3,ft:10,mph:25,lbs:250,speed:19,top:'#1f5fb8',belly:'#e4ecf7',fact:'Blue sharks are deep-ocean travelers. One tagged blue shark swam over 3,700 miles across the Atlantic!'},
 {name:'Shortfin Mako',len:7.4,h:.7,w:.74,sn:1.4,ft:12,mph:45,lbs:300,speed:21,top:'#22468f',belly:'#eef2f8',fact:'The fastest shark on Earth! Makos can rocket through the water at over 45 mph (74 km/h) — faster than a car on a city street.'},
 {name:'Bull Shark',len:8.4,h:.95,w:1.05,sn:.7,ft:11,mph:25,lbs:500,speed:19,top:'#5c6b74',belly:'#dfe4e8',fact:'Bull sharks are the only big sharks that can swim in fresh water. They have been found far up rivers, even in lakes!'},
 {name:'Great Hammerhead',len:9.4,h:.84,w:.96,sn:.6,ft:15,mph:25,lbs:1000,speed:19,top:'#5f6f6a',belly:'#d9dfd7',hammer:true,fact:'Its wide head works like a metal detector. It can sense the tiny heartbeat of a stingray hiding under the sand.'},
 {name:'Tiger Shark',len:10.6,h:1.05,w:1.15,sn:.8,ft:16,mph:20,lbs:1400,speed:20,top:'#3c4c58',belly:'#c9d2d8',stripes:true,fact:'Tiger sharks will try to eat almost anything. Scientists have found license plates and tires in their stomachs!'},
 {name:'Great White',len:12.2,h:1.3,w:1.35,sn:1.15,ft:20,mph:35,lbs:2500,speed:21,top:'#4f5964',belly:'#f4f6f8',white:true,fact:'A great white can smell a single drop of blood in a swimming pool of water, and has about 300 teeth in rows.'},
 {name:'Whale Shark',len:15,h:1.9,w:2.1,sn:.5,ft:40,mph:3,lbs:40000,speed:20,top:'#3c5666',belly:'#c6d4da',spots:true,fact:'The whale shark is the biggest fish alive, as long as a bus, but it eats tiny plankton. Every whale shark has its own pattern of spots, like a fingerprint.'},
 {name:'MEGALODON',len:18.5,h:2.2,w:2.3,sn:1.05,ft:60,mph:30,lbs:100000,speed:22,top:'#2b303c',belly:'#8b93a3',mega:true,fact:'Megalodon lived millions of years ago and was as long as a school bus — the biggest shark that ever lived. Nothing in the sea could challenge it.'}
];
const MATH=[
 {name:'Adding to 10'},{name:'Adding to 20'},{name:'Subtraction to 20'},{name:'Adding to 100'},{name:'Add & subtract to 100'},{name:'Multiplication ×2 ×5 ×10'},
 {name:'Multiplication ×3 ×4 ×6'},{name:'Times tables to 10×10'},{name:'Division'},{name:'Multiply & divide to 12×12'},{name:'Two-step problems'},{name:'Big number challenge'}];
const PREY=[
 {name:'Krill',size:.6,pts:1,top:'#d98aa0',belly:'#f6c9d3',speed:2.5,slim:.5,tall:.6},
 {name:'Sardine',size:1.1,pts:2,top:'#3a5a78',belly:'#e8eef3',speed:8,school:true,silver:true,slim:.45,tall:.9},
 {name:'Clownfish',size:1.4,pts:4,top:'#ff6a1a',belly:'#ff9a4a',clown:true,speed:5,slim:.55,tall:1.1},
 {name:'Angelfish',size:1.9,pts:6,top:'#f2c12e',belly:'#ffe58a',angel:true,speed:4.5,slim:.35,tall:1.6},
 {name:'Parrotfish',size:2.6,pts:10,top:'#1fa89a',belly:'#8de0d2',parrot:true,speed:5,slim:.55,tall:1.1},
 {name:'Tuna',size:3.7,pts:15,top:'#1f3f6f',belly:'#dfe6ee',tuna:true,silver:true,speed:10,slim:.6,tall:.9},
 {name:'Barracuda',size:5.2,pts:22,top:'#5f7a6a',belly:'#d5ddd6',cuda:true,silver:true,speed:11,slim:.45,tall:.5},
 {name:'Grouper',size:6.6,pts:30,top:'#6f4a2f',belly:'#c9a882',grouper:true,speed:4,slim:.75,tall:1.15},
 {name:'Swordfish',size:8.3,pts:45,top:'#2f4670',belly:'#c8d3e2',sword:true,silver:true,speed:12,slim:.5,tall:.75},
 {name:'Marlin',size:10.1,pts:60,top:'#173a8a',belly:'#cfd9ea',marlin:true,silver:true,speed:13,slim:.5,tall:.8},
 {name:'Orca',size:14,pts:100,top:'#0d1015',belly:'#f4f4f4',orca:true,speed:9,slim:.75,tall:.85}
];
const UPG=[

function spawnFish(p,pos,size){const f=buildFish(p,size||p.size);const e={kind:'fish',spec:p,size:size||p.size,pos,h:randHeading(),spd:p.speed*rnd(.8,1.2),ph:rnd(0,6),obj:f.grp,uni:f.uni,t:0};if(!edible(e))e.ring=dangerRing();addEnt(e);return e;}

  if(!pool.length)pool=PREY.filter(p=>p.size<ps*.8);if(!pool.length)pool=[PREY[0]];const p=pool[Math.floor(Math.random()*pool.length)];const pos=spawnPoint(30,55);

function spawnJelly(){const size=rnd(2.4,3.4)+S.level*.2;const pos=spawnPoint(20,45);pos.y=FLOOR;addEnt({kind:'jelly',size,pos,vy:rnd(1.3,2.2),ph:rnd(0,6),obj:buildJelly(size),t:0});}

  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTex(String(n),'#0b2540','#ffffff'),transparent:true,depthTest:false}));sp.scale.set(size*1.1,size*.55,1);sp.position.y=size*.6;f.grp.add(sp);

/* ================= MATH ================= */
function newProblem(){const L=S.level,r=Math.random();let a,b,op,c=null;
  if(L===0){a=rndi(1,5);b=rndi(1,5);op='+';}
  else if(L===1){a=rndi(2,12);b=rndi(1,20-a);op='+';}
  else if(L===2){if(r<.3){a=rndi(2,12);b=rndi(1,20-a);op='+';}else{a=rndi(5,20);b=rndi(1,a-1);op='−';}}
  else if(L===3){a=rndi(10,59);b=rndi(10,99-a);op='+';}
  else if(L===4){if(r<.5){a=rndi(10,59);b=rndi(10,99-a);op='+';}else{a=rndi(20,99);b=rndi(1,a-1);op='−';}}
  else if(L===5){a=[2,5,10][rndi(0,2)];b=rndi(1,10);op='×';if(Math.random()<.5){const t=a;a=b;b=t;}}
  else if(L===6){a=[3,4,6][rndi(0,2)];b=rndi(1,10);op='×';if(Math.random()<.5){const t=a;a=b;b=t;}}
  else if(L===7){a=rndi(2,10);b=rndi(2,10);op='×';}
  else if(L===8){b=rndi(2,10);const q=rndi(2,10);a=b*q;op='÷';}
  else if(L===9){if(r<.5){a=rndi(2,12);b=rndi(2,12);op='×';}else{b=rndi(2,12);const q=rndi(2,12);a=b*q;op='÷';}}
  else if(L===10){a=rndi(2,9);b=rndi(2,9);c=rndi(1,20);op='×+';}
  else{if(r<.4){a=rndi(100,899);b=rndi(10,99);op='+';}else if(r<.7){b=rndi(3,12);const q=rndi(5,12);a=b*q;op='÷';}else{a=rndi(11,25);b=rndi(2,9);op='×';}}
  const ans=op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:op==='÷'?a/b:a*b+c;const set=new Set([ans]);
  const cand=op==='÷'?[ans+1,ans-1,ans+2,ans-2,b,a-b,ans*2]:[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,op==='×'?ans+a:a+b,op==='−'?a+b:Math.abs(a-b)];
  cand.sort(()=>Math.random()-.5);for(const c of cand){if(c>=0&&c!==ans&&set.size<3)set.add(c);}while(set.size<3)set.add(ans+rndi(3,9));
  const choices=[...set].sort(()=>Math.random()-.5);S.prob={text:op==='×+'?`${a} × ${b} + ${c}`:`${a} ${op} ${b}`,ans,choices};choices.forEach((n,i)=>spawnNumFish(n,i));
  const pill=$('mathPill');pill.className='';pill.innerHTML=`Find the fish with <b>${S.prob.text}</b>`;}
function mathSolved(e,i){removeEnt(i);for(let j=ents.length-1;j>=0;j--)if(ents[j].kind==='num')removeEnt(j);S.combo+=comboM();S.comboT=1.8;const mult=Math.min(4,1+Math.floor(S.combo/3));let pts=15*mult;S.solved++;S.mstreak++;if(S.mstreak%3===0){pts+=10;setTimeout(()=>popText(P.pos,`${S.mstreak} in a row! +10`,'#ffd23f',true),300);}S.energy=Math.min(S.energyMax,S.energy+35);P.mouth=1;
  burst(e.pos,0x7dd3fc,30,8);popText(e.pos,`Yes! ${S.prob.text} = ${S.prob.ans}  +${pts}`,'#86efac',true);sfx.gold();const pill=$('mathPill');pill.className='good';pill.innerHTML=`Correct! <b>${S.prob.text} = ${S.prob.ans}</b>`;S.prob=null;S.mathT=1.8;addCoins(10*(A().mathCoinM||1));addScore(pts);}
function mathWrong(e,i){removeEnt(i);S.combo=0;S.mstreak=0;if(!S.up.hint)S.energy=Math.max(0,S.energy-12);S.shake=.15;popText(e.pos,S.up.hint?`Not ${e.n}. The answer is ${S.prob.ans}`:`Not ${e.n}. Try again!`,'#fecaca',true);sfx.wrong();const pill=$('mathPill');pill.className='bad';setTimeout(()=>{if(S.prob)pill.className='';},600);}

function popText(pos,text,color,big){const v=pos.clone().project(camera);if(v.z>1)return;const el=document.createElement('div');el.className='pop-txt'+(big?' big':'');el.textContent=text;el.style.color=color||'#fff';el.style.left=((v.x+1)/2*canvas.clientWidth)+'px';el.style.top=((1-v.y)/2*canvas.clientHeight)+'px';$('pops').appendChild(el);setTimeout(()=>el.remove(),1200);}
function setPlayerShark(){if(P.obj)scene.remove(P.obj);const b=buildShark(skin(),curLen());P.obj=b.grp;P.uni=b.uni;P.jaw=b.jaw;P.mouthGrp=b.mouthGrp;P.obj.rotation.order='YXZ';scene.add(b.grp);}
function beginLevel(){while(ents.length)removeEnt(ents.length-1);
  S.score=0;S.combo=0;S.comboT=0;S.frenzy=0;S.energyMax=100+25*S.up.tank;S.energy=S.energyMax;S.revived=false;S.hurtLevel=false;S.mstreak=0;S.prob=null;S.mathT=3;S.hungryHint=false;S.maxLives=3+extraHearts();S.lives=S.maxLives+(S.bonusHeart?1:0);S.bonusHeart=false;S.spawnT=0;S.jellyT=8;S.pufferT=11;S.goldT=9;S.bubbleT=16;
  P.pos.set(0,6,0);P.yaw=0;P.pitch=0;P.speed=0;P.inv=1.5+4*S.up.shield;P.mouth=0;setPlayerShark();
  for(let i=0;i<8;i++){const p=PREY.filter(q=>q.size<curLen()*.8&&q.size>curLen()*.12);const q=p[Math.floor(Math.random()*p.length)]||PREY[0];spawnFish(q,spawnPoint(12,30));}
  applyDepth();showHint(S.level===0?'Left thumb steers, right thumb boosts. Eat small fish, find the right number!':`Math this level: ${MATH[S.level].name}`,4.5);
  $('sharkName').textContent=skin().name;$('levelLbl').textContent=`Level ${S.level+1} of ${SHARKS.length} · ${MATH[S.level].name}`;$('coins').textContent='🪙 '+S.coins;updateHUD();$('hud').classList.remove('hidden');$('controls').style.display='';}
function applyDepth(){const d=depth();const fc=new THREE.Color(0x1f7fb8).lerp(new THREE.Color(0x03101f),d);scene.fog.color.copy(fc);scene.fog.density=.014+d*.012;sun.intensity=1.9*(1-d*.7);hemi.intensity=.95*(1-d*.6);fill.intensity=.35+d*.25;
  surfMat.uniforms.uA.value=Math.max(0,1-d*1.8);rayMat.uniforms.uA.value=Math.max(0,1-d*1.4);backMat.uniforms.cTop.value.set(0x63c7ef).lerp(new THREE.Color(0x0a2a4c),d);backMat.uniforms.cBot.value.copy(fc);}

  const ef=$('energyFill');ef.style.width=Math.max(0,S.energy/S.energyMax*100)+'%';ef.classList.toggle('low',S.energy<25);$('energyTxt').textContent=S.energy<25?'Hungry!':'Energy';$('depthLbl').textContent=`Depth ${Math.max(0,Math.round((TOP+6-P.pos.y)*.6))} m`;}
let quiz=null;
function quizHTML(){const prev=SHARKS[S.level-1],s=spec();let q,ans;const L=S.level;
  if(L>=8){const per=rndi(2,6),n=[3,4,5,6][rndi(0,3)];q=`A ${s.name} eats <b>${per} fish</b> every hour. How many fish does it eat in <b>${n} hours</b>?`;ans=per*n;}
  else if(L>=5){const groups=rndi(2,5),each=rndi(2,6);q=`${groups} ${s.name}s swim together. Each one has <b>${each} pilot fish</b> following it. How many pilot fish in total?`;ans=groups*each;}
  else if(Math.random()<.5){q=`A ${prev.name} is about <b>${prev.ft} feet</b> long. A ${s.name} is about <b>${s.ft} feet</b> long. How many feet longer is your new shark?`;ans=s.ft-prev.ft;}
  else{q=`A ${prev.name} swims about <b>${prev.mph} mph</b>. A ${s.name} swims about <b>${s.mph} mph</b>. What is the difference in speed?`;ans=Math.abs(s.mph-prev.mph);}
  const set=new Set([ans]);[ans+1,ans-1,ans+2,ans+5,ans-3,ans+10].sort(()=>Math.random()-.5).forEach(c=>{if(c>=0&&set.size<3)set.add(c);});quiz={ans,choices:[...set].sort(()=>Math.random()-.5)};
  return `<div class="quiz">🧮 ${q}<div class="qbtns">${quiz.choices.map(c=>`<button class="qbtn" data-v="${c}">${c}</button>`).join('')}</div><div class="qmsg" id="qmsg">Answer right for a bonus ❤️ and +25 coins</div></div>`;}
function wireQuiz(){document.querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>{const v=+b.dataset.v;document.querySelectorAll('.qbtn').forEach(x=>{x.disabled=true;if(+x.dataset.v===quiz.ans)x.classList.add('ok');});S.quizDone=true;
  if(v===quiz.ans){$('qmsg').textContent='Correct! Bonus heart next level and +25 coins.';S.bonusHeart=true;S.solved++;addCoins(25);saveGame();sfx.gold();}else{b.classList.add('no');$('qmsg').textContent=`Close! The answer is ${quiz.ans}.`;sfx.wrong();}});}

const pvCam=new THREE.PerspectiveCamera(32,520/288,.1,100);const pvRT=new THREE.WebGLRenderTarget(520,288);pvRT.texture.encoding=THREE.sRGBEncoding;const pvBuf=new Uint8Array(520*288*4);
