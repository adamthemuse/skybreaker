name: Deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (game picker at the root, each game in its own folder)
        run: |
          set -e
          SRC=.
          if [ -d thiago-arcade-upload ]; then SRC=thiago-arcade-upload; fi
          mkdir -p _site/skybreaker
          cp -r skybreaker-site/. _site/skybreaker/
          if [ -f "$SRC/skybreaker-site/index.html" ]; then cp "$SRC/skybreaker-site/index.html" _site/skybreaker/index.html; fi
          rm -f _site/skybreaker/CNAME
          if [ -d "$SRC/games" ]; then cp -r "$SRC/games/." _site/; else cp -r skybreaker-site/. _site/; fi
          echo "thiago.kareem.si" > _site/CNAME
          find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
